<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Prime">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Seguimiento diario de hábitos: 31 días para mi prime.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Mi Prime · 31 días</title>
<style>
:root{
  color-scheme: light;
  --bg:#f9f9f7; --surface:#ffffff; --surface-2:#fcfcfb;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --line:#e1e0d9; --ring:rgba(11,11,11,.10);
  --ok:#0ca30c; --ok-soft:#e6f5e6;
  --fail:#fab219; --fail-soft:#fdf1d8;
  --free:#2a78d6; --free-soft:#e4eefb;
  --empty:#eceae3;
  --nodata:#a9a79f;
  --accent:#0b0b0b;
  --shadow:0 1px 2px rgba(11,11,11,.06),0 8px 24px rgba(11,11,11,.05);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#212120;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --line:#2c2c2a; --ring:rgba(255,255,255,.10);
    --ok:#0ca30c; --ok-soft:#122a12;
    --fail:#fab219; --fail-soft:#332713;
    --free:#3987e5; --free-soft:#132538;
    --empty:#2c2c2a;
    --nodata:#6b6a65;
    --accent:#ffffff;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#212120;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --line:#2c2c2a; --ring:rgba(255,255,255,.10);
  --ok:#0ca30c; --ok-soft:#122a12;
  --fail:#fab219; --fail-soft:#332713;
  --free:#3987e5; --free-soft:#132538;
  --empty:#2c2c2a;
  --nodata:#6b6a65;
  --accent:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.45;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
#app{max-width:520px;margin:0 auto;padding:0 14px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.hide{display:none !important}

/* ---------- header ---------- */
header{padding:calc(14px + env(safe-area-inset-top)) 0 8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand h1{font-size:21px}
.brand h1 small{display:block;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);font-size:17px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-t{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}

/* ---------- stat row ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 10px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:25px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.stat span{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- alert ---------- */
.alert{border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:14px;display:flex;gap:10px;align-items:flex-start;line-height:1.35}
.alert.risk{background:var(--fail-soft);border:1px solid var(--fail);color:var(--ink)}
.alert.good{background:var(--ok-soft);border:1px solid var(--ok);color:var(--ink)}
.alert b{font-weight:700}
.alert .ic{font-size:17px;line-height:1.1}

/* ---------- habit rows ---------- */
.hrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:none}
.dot{width:52px;height:52px;min-width:52px;border-radius:17px;display:grid;place-items:center;
  border:2px solid var(--line);background:var(--surface-2);font-size:23px;font-weight:700;color:var(--muted);
  transition:transform .12s ease,background .15s ease,border-color .15s ease}
.dot:active{transform:scale(.9)}
.dot.s-green{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.s-yellow{background:var(--fail);border-color:var(--fail);color:#0b0b0b}
.dot.s-blue{background:var(--free);border-color:var(--free);color:#fff}
.hmeta{flex:1;min-width:0}
.hname{font-size:15.5px;font-weight:600;line-height:1.25}
.hsub{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.hsub .warn{color:var(--fail);font-weight:700}
.hsub .now{color:var(--ink);font-weight:700}
.pq{width:36px;height:36px;min-width:36px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:16px;border:1px solid var(--line);background:var(--surface-2)}
.pq.ok{color:var(--ok)} .pq.no{color:var(--fail)}
.linkbtn{font-size:13px;color:var(--ink-2);text-decoration:underline;padding:6px 0 0}
.reflex{display:block;width:100%;text-align:left}
.reflex .frase{margin:0;font-size:15.5px;font-weight:600;line-height:1.45;letter-spacing:-.01em}
.reflex small{display:block;color:var(--muted);font-size:12.5px;margin-top:5px}
.reflex .ver{display:inline-block;font-size:12.5px;color:var(--ink-2);text-decoration:underline;margin-top:8px}
.sheet blockquote{margin:0 0 9px;padding:9px 12px;border-left:3px solid var(--line);font-size:14.5px;line-height:1.45}
.sheet blockquote.hoy{border-left-color:var(--ok)}
.sheet blockquote small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.cocina{background:var(--ok-soft);border:1px solid var(--ok);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.45;margin:10px 0 12px}
.more{width:38px;height:38px;min-width:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:19px;border:1px solid transparent}
.more:active{background:var(--surface-2);border-color:var(--line)}

/* ---------- notes ---------- */
textarea,input[type=text],input[type=number],input[type=time],input[type=date],input[type=month]{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;
  padding:11px 12px;color:var(--ink);font:inherit;font-size:15px;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:-1px}

/* ---------- legend ---------- */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:12px}
.legend i{width:13px;height:13px;border-radius:4px;display:inline-block;vertical-align:-2px;margin-right:6px;border:1px solid var(--ring)}

/* ---------- wheel ---------- */
.wheelwrap{width:100%;display:block}
svg{display:block;width:100%;height:auto;overflow:visible}
.cell{cursor:pointer}
.cell:active{opacity:.65}
.daylab{font-size:9.5px;fill:var(--muted);font-weight:600}
.ctr{fill:var(--ink);font-weight:700}
.ctr-s{fill:var(--muted);font-weight:600;font-size:9px;letter-spacing:.1em}

/* ---------- month nav ---------- */
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--shadow)}
.mnav b{font-size:15px;text-transform:capitalize}
.mnav button{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;color:var(--ink-2)}
.mnav button:active{background:var(--surface-2)}

/* ---------- weekly ---------- */
.weeks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wk{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:10px}
.wk h4{margin:0 0 6px;font-size:12px;font-weight:700;text-align:center;letter-spacing:-.01em}
.vd{display:flex;justify-content:center;gap:10px;font-size:11.5px;font-weight:700;margin-top:6px}
.vd .v{color:var(--ok)} .vd .d{color:var(--fail)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed=true]{background:var(--accent);color:var(--bg);border-color:var(--accent)}

/* ---------- lists (hacer más/menos) ---------- */
.li{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.li:last-child{border-bottom:none}
.li .bar{width:4px;height:19px;border-radius:2px;flex:none}
.li span{flex:1}
.li .x{color:var(--muted);font-size:17px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1}
.addrow button{padding:0 16px;border-radius:13px;background:var(--accent);color:var(--bg);font-weight:700;font-size:14px}

/* ---------- table ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:5px 3px;text-align:center;border-bottom:1px solid var(--line)}
.tbl th{color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.tbl td:first-child,.tbl th:first-child{text-align:left;color:var(--ink-2);font-weight:600;white-space:nowrap}
.tbl .g{color:var(--ok);font-weight:700}
.tbl .y{color:var(--fail);font-weight:700}
.tbl .b{color:var(--free);font-weight:700}
.tbl .n{color:var(--muted);font-weight:700}
.tblscroll{overflow-x:auto}
.tr-today{background:var(--surface-2)}

/* ---------- settings ---------- */
.srow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:none}
.srow span{flex:1;font-size:14.5px}
.drag{color:var(--muted);font-size:15px;padding:4px}
.btn{display:block;width:100%;padding:13px;border-radius:14px;background:var(--accent);color:var(--bg);font-weight:700;font-size:15px;text-align:center;margin-top:10px;text-decoration:none}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.switch{width:48px;height:28px;border-radius:999px;background:var(--empty);position:relative;transition:background .18s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-checked=true]{background:var(--ok)}
.switch[aria-checked=true]::after{transform:translateX(20px)}

/* ---------- bottom nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
.navin button{padding:9px 0 10px;display:grid;justify-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--muted)}
.navin button b{font-size:20px;line-height:1;font-weight:400}
.navin button[aria-current=true]{color:var(--ink)}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  animation:up .2s cubic-bezier(.2,.8,.3,1);max-height:88vh;overflow:auto}
@keyframes up{from{transform:translateY(22px)}to{transform:translateY(0)}}
.sheet h3{font-size:17px;margin-bottom:3px}
.sheet p.sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:13px;border-radius:15px;border:1px solid var(--line);margin-bottom:9px;text-align:left;background:var(--surface-2)}
.opt i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-style:normal;font-size:17px;font-weight:700;flex:none}
.opt b{display:block;font-size:15px;font-weight:650}
.opt small{color:var(--muted);font-size:12.5px}
.opt.sel{outline:2px solid var(--accent);outline-offset:-1px}
.i-green{background:var(--ok);color:#fff} .i-yellow{background:var(--fail);color:#0b0b0b}
.i-blue{background:var(--free);color:#fff} .i-none{background:var(--empty);color:var(--muted)}
.sheet .row2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px}
.danger{color:#d03b3b}

/* ---------- pasos ---------- */
.hero{font-size:48px;font-weight:700;letter-spacing:-.03em;line-height:1}
.hero small{display:block;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0;margin-top:6px}
.meter{height:10px;border-radius:999px;background:var(--empty);overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;border-radius:999px}
.stats.chico .stat b{font-size:20px}
.eje{font-size:9.5px;fill:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.eje.fuerte{fill:var(--ink-2)}
.pdet{font-size:13px;color:var(--ink-2);min-height:19px;margin:6px 0 0;text-align:center}
.mnav button:disabled{opacity:.3}
.comida{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.comida:last-child{border-bottom:none}
.comida .hm{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;min-width:66px;line-height:1.25}
.comida .hm small{display:block;font-size:11px}
.comida .ce{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left;padding:0}
.comida .pg{color:var(--muted);font-size:13px;white-space:nowrap}
.frec{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:13px;margin-top:7px;text-align:left;background:var(--surface-2);font-size:14px}
.frec span{flex:1;min-width:0}
.frec b{white-space:nowrap;font-variant-numeric:tabular-nums}
.frec small{color:var(--muted);white-space:nowrap}
.frec i{font-style:normal;font-weight:700;font-size:18px;color:var(--ok)}
.frec-t{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 0}
.frow{display:flex;align-items:center;gap:6px}
.frow .frec{flex:1}
.frow .x{color:var(--muted);font-size:17px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;margin-top:7px;flex:none}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;margin:12px 0 4px;cursor:pointer}
.chk input{width:20px;height:20px;flex:none;margin:0;accent-color:var(--ok)}
.detalle{font-size:12.5px;color:var(--muted);line-height:1.5;margin:10px 0 0}
.pie{font-size:12.5px;color:var(--muted);margin:10px 0 0;line-height:1.5}
tr.tap{cursor:pointer}
.comida span.n{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.comida b{font-variant-numeric:tabular-nums;white-space:nowrap}
.comida .x{color:var(--muted);font-size:17px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center}
.sheet label.campo{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
.sheet select{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:11px 12px;color:var(--ink);font:inherit;font-size:15px}
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.fotos.una{grid-template-columns:1fr}
.fotos figure{position:relative;margin:0}
.fotos img{width:100%;height:140px;object-fit:cover;border-radius:12px;display:block}
.fotos.una img{height:220px}
.fotos .x{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-size:15px}
.item{display:grid;grid-template-columns:1fr 78px 64px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.item input{padding:8px;font-size:14px;text-align:right}
.item small{display:block;color:var(--muted);font-size:12px}
details summary{cursor:pointer;font-size:13px;color:var(--ink-2);padding:2px 0}

/* ---------- finanzas ---------- */
.cuentas{margin-top:12px}
.cuentas button{display:flex;align-items:baseline;gap:10px;width:100%;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px;text-align:left}
.cuentas button span{flex:1}
.cuentas button b{font-variant-numeric:tabular-nums;white-space:nowrap}
.cuentas button i{font-style:normal;color:var(--muted)}
.fila{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.fila:last-child{border-bottom:none}
.fila .ce{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left;padding:0}
.fila .hm{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;min-width:40px;line-height:1.25}
.fila .n{flex:1;min-width:0;line-height:1.3}
.fila .n small{display:block;color:var(--muted);font-size:12px}
.fila .n small.warn{color:var(--fail);font-weight:700}
.fila b{font-variant-numeric:tabular-nums;white-space:nowrap}
.fila .x{color:var(--muted);font-size:17px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none}
.fila.pagado .n,.fila.pagado b{color:var(--muted)}
.hito{display:flex;gap:10px;padding:7px 0;font-size:14px;border-bottom:1px solid var(--line)}
.hito:last-child{border-bottom:none}
.hito span{flex:1}
.hito b{white-space:nowrap}
.renglon{display:flex;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px solid var(--line);color:var(--ink-2)}
.renglon span{flex:1;min-width:0}
.renglon b{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.rumbo{margin:0;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.45}
.rumbo:last-of-type{border-bottom:none}
.cab{display:flex;align-items:center;gap:2px}
.cab span{flex:1}
.cab button{width:30px;height:26px;border-radius:8px;font-size:17px;color:var(--ink-2);letter-spacing:0}
.cab button:disabled{opacity:.3}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand">
      <h1><small>31 días para</small>Mi Prime</h1>
      <button class="iconbtn" id="themeBtn" title="Cambiar tema" aria-label="Cambiar tema">◐</button>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav>
  <div class="navin">
    <button data-tab="hoy"    aria-current="true"><b>◎</b>Hoy</button>
    <button data-tab="mes"    aria-current="false"><b>◍</b>Mes</button>
    <button data-tab="semana" aria-current="false"><b>◔</b>Semanas</button>
    <button data-tab="pasos"  aria-current="false"><b>▥</b>Pasos</button>
    <button data-tab="comida" aria-current="false"><b>◫</b>Comida</button>
    <button data-tab="finanzas" aria-current="false"><b>$</b>Finanzas</button>
    <button data-tab="mas"    aria-current="false"><b>≡</b>Más</button>
  </div>
</nav>

<div id="modal"></div>

<script>
"use strict";

/* =========================================================================
   1. ESTADO Y PERSISTENCIA
   ========================================================================= */
const KEY = "miPrime.v1";
/* ¿Corre como app de Android? La app (Capacitor) inyecta window.Capacitor antes que esta página. */
const NATIVO = !!window.Capacitor?.isNativePlatform?.();
/* La compila y la firma GitHub Actions en cada cambio de main (.github/workflows/android.yml). */
const APK_URL = "https://github.com/sotogaston/mi-prime/releases/download/android/mi-prime.apk";
let AVISOS_ESTADO = null, avisosTimer = null;   // avisos de la app (sección 8); render() ya los usa
let PASOS_ESTADO = null, pasosEnCurso = null;   // lectura de Health Connect (sección 8); vPasos() la muestra
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS = ["dom","lun","mar","mié","jue","vie","sáb"];
const DIAS_LARGOS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];

let memoryOnly = false;
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return migrate(JSON.parse(raw));
  }catch(e){ memoryOnly = true; }
  return seed();
}
function save(){
  if(memoryOnly) return;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ memoryOnly = true; }
}
function migrate(s){
  s.habits ||= []; s.marks ||= {}; s.notes ||= {};
  s.doLess ||= []; s.doMore ||= []; s.settings ||= {};
  s.autoClosed ||= {}; s.values ||= {};   // v2: quién escribió la marca y el valor real
  s.feriados ||= []; s.laborables ||= []; // feriados propios y feriados que se trabajan (ver esLibre)
  s.pasos ||= {};                          // pasos por día: Health Connect o el CSV de Samsung Health
  s.comidas ||= {}; s.pesos ||= {};        // comidas por día y peso por día (pestaña Comida)
  s.cinturas ||= {};                       // cintura en cm por día
  s.frecuentes ||= [];                     // comidas que se repiten, para cargarlas con un toque
  s.settings.texture ??= false;
  s.habits.forEach((h,i)=>{ h.id ||= uid(); h.order ??= i; });
  return s;
}
function uid(){ return "h" + Math.random().toString(36).slice(2,9); }

function seed(){
  const names = ["Levantarme 06:30","Meditar","Ejercicio","Leer","Elegir bien con el azúcar","Dormir 7 hs","Automatizar"];
  return {
    version: 1,
    createdAt: iso(new Date()),
    habits: names.map((n,i)=>({ id:uid(), name:n, order:i })),
    marks: {},
    autoClosed: {},
    values: {},
    feriados: [],
    laborables: [],
    notes: {},
    doLess: ["Usar el celu","Enojarme","Gastar sin pensar","Pensar en el tiempo"],
    doMore: ["Preguntar si no entiendo algo","Mejoras en la casa","Salir a caminar"],
    settings: { lastClosed:null, texture:false, theme:"auto" }
  };
}

/* @logica:inicio */
/* =========================================================================
   LÓGICA PURA — única copia
   -------------------------------------------------------------------------
   De acá hasta @logica:fin: fechas, reglas, estadísticas, metas e import.
   Las pruebas en Node (mi-prime-v2.pruebas.js, vía cargar-logica.mjs)
   recortan este bloque y lo corren tal cual, así que tiene que poder
   ejecutarse solo: lo único que usa de afuera es S y save().
   ========================================================================= */
/* NODATA nunca se guarda: es como se lee el amarillo que puso el cierre
   automático en un día hábil que nadie abrió (ver getMark). */
const ST = { GREEN:"green", YELLOW:"yellow", BLUE:"blue", NODATA:"nodata" };

/* ---- fechas ---- */
function iso(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function parseISO(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function addDays(d,n){ const x = new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }
function isWeekend(dateStr){ const w = parseISO(dateStr).getDay(); return w===0 || w===6; }
function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }

const TODAY = iso(new Date());

/* Feriados nacionales de Argentina en días hábiles (fecha efectiva, ya
   trasladada) y no laborables. Fuente: argentina.gob.ar/jefatura/feriados-nacionales-2026,
   Ley 27.399 y Decreto 1103/2026 (9/11, visita del Papa). Los de 2027 salen de
   la regla de traslado y de la Pascua (28/3): confirmarlos cuando se publique
   el calendario oficial. Un feriado se trata como fin de semana: no es
   obligatorio y lo que no se marque queda azul. El usuario puede sumar días
   (S.feriados) o decir que un feriado le toca trabajar (S.laborables). */
const FERIADOS_AR = [
  "2026-10-12","2026-11-09","2026-11-23","2026-12-07","2026-12-08","2026-12-25",
  "2027-01-01","2027-02-08","2027-02-09","2027-03-24","2027-03-25","2027-03-26","2027-04-02",
  "2027-05-25","2027-06-21","2027-07-09","2027-08-16","2027-10-11","2027-12-08"
];
function esFeriado(ds){
  return (FERIADOS_AR.includes(ds) || (S.feriados || []).includes(ds)) && !(S.laborables || []).includes(ds);
}
function esLibre(ds){ return isWeekend(ds) || esFeriado(ds); }

/* ---- lectura/escritura de marcas ---- */
/* Un día hábil que nadie abrió queda guardado como amarillo del cierre
   automático, pero se lee como "sin dato": no es una falla registrada, es un
   hueco. Así no hace falta migrar datos y el respaldo sigue siendo el mismo. */
function getMark(date, hid){
  const m = (S.marks[date] || {})[hid] || null;
  if(m === ST.YELLOW && (S.autoClosed?.[date] || []).includes(hid)) return ST.NODATA;
  return m;
}
function setMark(date, hid, st){
  if(!S.marks[date]) S.marks[date] = {};
  if(st === null) delete S.marks[date][hid];
  else S.marks[date][hid] = st;
  if(Object.keys(S.marks[date]).length === 0) delete S.marks[date];
  save();
}

/* =========================================================================
   2. REGLAS DEL SISTEMA
   ========================================================================= */

/* Cierre automático del día:
   al abrir la app, todo día ya pasado que quedó sin marcar se resuelve solo.
   Fin de semana o feriado -> azul (no era obligatorio). Día hábil -> amarillo
   del robot, que getMark() lee como "sin dato". */
function autoCloseDays(){
  const yesterday = addDays(new Date(), -1);
  const start = S.settings.lastClosed ? addDays(parseISO(S.settings.lastClosed), 1) : parseISO(S.createdAt);
  if(start > yesterday){ return 0; }
  let filled = 0;
  for(let d = start; d <= yesterday; d = addDays(d,1)){
    const ds = iso(d), free = esLibre(ds);
    for(const h of S.habits){
      if(!getMark(ds, h.id)){
        setMark(ds, h.id, free ? ST.BLUE : ST.YELLOW);
        markAutoClosed(S, ds, h.id);       // enganche 2: la marca es del robot
        filled++;
      }
    }
  }
  S.settings.lastClosed = iso(yesterday);
  save();
  return filled;
}

/* Racha: verdes seguidos. El azul no suma pero tampoco corta. El amarillo
   corta, y el sin dato también: ese día no se hizo. */
function streak(hid){
  let n = 0;
  for(let i = 0; i < 400; i++){
    const ds = iso(addDays(new Date(), -i));
    const m = getMark(ds, hid);
    if(m === ST.GREEN) n++;
    else if(m === ST.BLUE) continue;
    else if(m === ST.YELLOW) break;
    else if(i === 0) continue;   // hoy sin marcar todavía: no corta
    else break;
  }
  return n;
}

/* Último día obligatorio antes de `date`: los azules se saltean, hasta 7 días.
   Cruza el mes sin problema porque mira el calendario, no un rango. */
function prevDay(date, hid){
  for(let i = 1; i <= 7; i++){
    const ds = iso(addDays(parseISO(date), -i)), m = getMark(ds, hid);
    if(m === ST.BLUE) continue;
    return { date: ds, mark: m };
  }
  return null;
}
/* Regla dura: no se pueden tener 2 amarillos seguidos.
   Devuelve true si el día anterior (sin contar azules) ya fue amarillo.
   Un día vacío o sin dato corta la cadena: no es un amarillo. */
function prevIsYellow(date, hid){ return prevDay(date, hid)?.mark === ST.YELLOW; }
/* Hábitos que hoy no pueden fallar. En fin de semana o feriado no hay riesgo:
   lo que no se marque queda azul. */
function atRisk(){
  if(esLibre(TODAY)) return [];
  return S.habits.filter(h => prevIsYellow(TODAY, h.id) && getMark(TODAY,h.id) !== ST.GREEN);
}

/* Conteos */
function countRange(y, m, from, to, hid){
  const out = { green:0, yellow:0, blue:0, nodata:0, empty:0 };
  const dim = daysInMonth(y,m);
  for(let d = from; d <= Math.min(to, dim); d++){
    const ds = iso(new Date(y,m,d));
    const list = hid ? [hid] : S.habits.map(h=>h.id);
    for(const id of list){
      const mk = getMark(ds, id);
      if(mk === ST.GREEN) out.green++;
      else if(mk === ST.YELLOW) out.yellow++;
      else if(mk === ST.BLUE) out.blue++;
      else if(mk === ST.NODATA) out.nodata++;
      else out.empty++;
    }
  }
  return out;
}

/* =========================================================================
   2.5. MÓDULO v2 — origen de las marcas, reglas rotas, metas, import
   -------------------------------------------------------------------------
   Antes vivía también en mi-prime-v2.js; ahora esta es la única copia.
   migrateV2() se llama así porque migrate() ya existe y normaliza el
   estado v1 en cada load().
   Prime % = verdes/(verdes+amarillos+sin dato): el sin dato cuenta como
   no hecho, aunque no sea una regla rota.
   ========================================================================= */
const ORIGIN = { MANUAL:"manual", AUTO:"auto", NONE:"none" };

const METAS_INICIALES = {
  "Caminar seguido":   { unidad:"min",    piso:10, meta:20, sube:5, tope:45, fuente:"exercise_time" },
  "Inglés":            { unidad:"min",    piso:15, meta:30, sube:5, tope:60 },
  "Leer":              { unidad:"min",    piso:10, meta:20, sube:5, tope:45 },
  "Ejercicio":         { unidad:"series", piso:9,  meta:15, sube:3, tope:21 },
  "Moverme cada hora": { unidad:"horas",  piso:6,  meta:8,  sube:1, tope:12, fuente:"move_hourly" }
};

function migrateV2(S, hoy){
  if(S.version >= 2) return S;

  S.autoClosed = S.autoClosed || {};   // { "2026-08-14": ["h7s5ohcv"] }
  S.values     = S.values     || {};   // { "2026-08-14": { "hat3pk68": 32 } }

  // "Caminar 6000 pasos" se parte en dos hábitos distintos
  const caminar = S.habits.find(h => /6000\s*pasos/i.test(h.name));
  if(caminar){
    caminar.name = "Caminar seguido";
    caminar.auto = { source:"steps", threshold:6000, near:0.90 };
    S.habits.push({
      id: "h" + Math.random().toString(36).slice(2, 9),
      name: "Moverme cada hora",
      order: S.habits.length
    });
  }

  for(const h of S.habits){
    const cfg = METAS_INICIALES[h.name];
    if(cfg) h.goal = Object.assign({}, cfg, { desde: hoy });
  }

  S.version = 2;
  return S;
}

/* ---- estadísticas: una sola pasada, todo lo que muestran Hoy y Mes ----
   Regla rota = amarillo con prevIsYellow(): la misma definición que el cartel
   de riesgo y la confirmación del 2º amarillo, así que cruza el mes. */
function stats(S, desde, hasta){
  const claves = Object.keys(S.marks).sort();
  let victorias = 0, amarillos = 0, sinDato = 0, reglasRotas = 0, tropiezos = 0;
  let mejorRacha = 0, mejorLimpia = 0;
  const rotasPor = [];
  const ini = desde || claves[0], fin = hasta || claves[claves.length - 1];

  for(const h of (ini && fin ? S.habits : [])){
    let racha = 0, limpia = 0;

    for(let d = parseISO(ini); iso(d) <= fin; d = addDays(d,1)){
      const ds = iso(d);
      const m = getMark(ds, h.id);
      if(!m || m === ST.BLUE) continue;       // vacío y azul no cuentan

      if(m === ST.NODATA){                    // no se hizo, pero no es una falla registrada
        sinDato++;
        racha = 0;
        continue;
      }

      if(m === ST.GREEN){
        victorias++;
        racha++;  limpia++;
        if(racha  > mejorRacha)  mejorRacha  = racha;
        if(limpia > mejorLimpia) mejorLimpia = limpia;
        continue;
      }

      amarillos++;
      racha = 0;                              // el amarillo siempre corta la racha
      if(prevIsYellow(ds, h.id)){
        reglasRotas++;
        limpia = 0;                           // solo la regla rota corta la limpia
        rotasPor.push({ fecha:ds, habito:h.name });
      } else {
        tropiezos++;
        limpia++;
        if(limpia > mejorLimpia) mejorLimpia = limpia;
      }
    }
  }

  const base = victorias + amarillos + sinDato;
  return {
    victorias,
    reglasRotas,
    tropiezos,
    amarillos,
    sinDato,
    prime: base ? Math.round(1000 * victorias / base) / 10 : 0,
    mejorRacha,
    mejorRachaLimpia: mejorLimpia,
    rotasPor
  };
}
function statsMes(y, m){
  return stats(S, iso(new Date(y, m, 1)), iso(new Date(y, m, daysInMonth(y, m))));
}

/* ---- metas y progresión automática ----
   Sube tras 21 días cumpliendo la meta el 80% de las veces.
   Baja tras 21 días cumpliendo el piso menos de la mitad de las veces. */
const VENTANA = 21, PARA_SUBIR = 0.80, PARA_BAJAR = 0.50;

function diasEntre(a, b){
  return Math.round((parseISO(b) - parseISO(a)) / 86400000);
}

function evaluarProgresion(S, hoy){
  const avisos = [];

  for(const h of S.habits){
    const g = h.goal;
    if(!g || !g.desde || h.auto?.source === "steps") continue;   // el de pasos se mide en pasos
    if(diasEntre(g.desde, hoy) < VENTANA) continue;

    let obligatorios = 0, llegoMeta = 0, llegoPiso = 0;
    for(const d of Object.keys(S.marks)){
      if(d < g.desde || d >= hoy) continue;
      const m = getMark(d, h.id);
      if(!m || m === ST.BLUE || m === ST.NODATA) continue;   // sin dato: no hay valor que medir
      obligatorios++;
      const v = S.values?.[d]?.[h.id];
      const valor = (v != null) ? v : (m === ST.GREEN ? g.meta : 0);
      if(valor >= g.meta) llegoMeta++;
      if(valor >= g.piso) llegoPiso++;
    }

    if(obligatorios < 10){ continue; }      // muestra muy chica, no se decide nada

    const antes = g.meta;
    if(llegoMeta / obligatorios >= PARA_SUBIR && g.meta < g.tope){
      g.meta = Math.min(g.meta + g.sube, g.tope);
      g.piso = Math.round(g.meta * 0.6);
      avisos.push({ habito:h.name, tipo:"sube", de:antes, a:g.meta, unidad:g.unidad });
    } else if(llegoPiso / obligatorios < PARA_BAJAR){
      g.meta = Math.max(g.meta - g.sube, g.sube);
      g.piso = Math.round(g.meta * 0.6);
      avisos.push({ habito:h.name, tipo:"baja", de:antes, a:g.meta, unidad:g.unidad });
    }
    g.desde = hoy;                          // la ventana siempre se reinicia
  }

  if(avisos.length) save();
  return avisos;
}

/* Un toque = cumplí la meta. Toque largo = poner el valor real. */
function setValor(S, date, hid, valor){
  const h = S.habits.find(x => x.id === hid);
  if(!h?.goal) return;
  if(!S.values) S.values = {};
  if(!S.values[date]) S.values[date] = {};
  S.values[date][hid] = valor;
  setMark(date, hid, valor >= h.goal.piso ? ST.GREEN : ST.YELLOW);
  if(Object.keys(S.values[date]).length === 0) delete S.values[date];
  save();
}

/* ---- origen de las marcas: manual > import > cierre automático ---- */
function originOf(S, date, hid){
  const m = S.marks?.[date]?.[hid];
  if(!m) return ORIGIN.NONE;
  return (S.autoClosed?.[date] || []).includes(hid) ? ORIGIN.AUTO : ORIGIN.MANUAL;
}
function markAutoClosed(S, date, hid){
  if(!S.autoClosed) S.autoClosed = {};
  (S.autoClosed[date] = S.autoClosed[date] || []).push(hid);
}
/* La marca pasa a ser tuya: deja de ser del cierre automático y de Finanzas */
function markManual(S, date, hid){ sacarDe(S.autoClosed, date, hid); sacarDe(S.marcasFin, date, hid); }
function sacarDe(mapa, date, hid){
  const a = mapa?.[date];
  if(!a) return;
  const i = a.indexOf(hid);
  if(i >= 0) a.splice(i, 1);
  if(a.length === 0) delete mapa[date];
}

/* ---- import desde Samsung Health ----
   Trampas del archivo: línea 1 es metadata, BOM, coma sobrante al final de
   cada fila, varias filas por día, y day_time se corta como TEXTO — nunca
   new Date(), que reintroduce el bug de UTC. */
function parseSamsungSteps(text){
  const lines = text.replace(/^\uFEFF/, "").split(/\r?\n/);
  if(lines.length < 3) throw new Error("El archivo no tiene filas de datos.");
  const head = lines[1].split(",");
  const iDay = head.indexOf("day_time"), iCount = head.indexOf("count");
  if(iDay < 0 || iCount < 0)
    throw new Error("No parece el export de pasos. Buscá el archivo que termina en step_daily_trend.");
  const byDay = {};
  for(let i = 2; i < lines.length; i++){
    const f = lines[i].split(",");
    if(f.length < head.length) continue;
    const date = (f[iDay] || "").slice(0, 10);
    const n = parseInt(f[iCount], 10);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || !Number.isFinite(n)) continue;
    byDay[date] = Math.max(byDay[date] || 0, n);
  }
  if(!Object.keys(byDay).length) throw new Error("No se encontró ningún día con pasos.");
  return byDay;
}

function planStepImport(S, stepsByDay, today){
  const targets = S.habits.filter(h => h.auto?.source === "steps");
  const plan = [];
  if(!targets.length) return plan;
  const dates = Object.keys(stepsByDay).sort();

  for(const h of targets){
    const threshold = metaPasos(S), near = h.auto.near;
    const floor = Math.round(threshold * (near ?? 0.9));
    for(const date of dates){
      if(date >= today) continue;                       // el día en curso no se toca
      if(S.createdAt && date < S.createdAt) continue;
      if(esLibre(date)) continue;                       // fin de semana o feriado: sin meta
      const steps = stepsByDay[date];
      const from = getMark(date, h.id);                  // un sin dato no es igual a un amarillo
      const origin = originOf(S, date, h.id);

      let to, why, ask = false;
      if(steps >= threshold){ to = ST.GREEN; why = `${steps.toLocaleString("es-AR")} pasos`; }
      else if(steps >= floor){ to = ST.GREEN; ask = true;
        why = `${steps.toLocaleString("es-AR")} pasos — faltaron ${threshold - steps}`; }
      else { to = ST.YELLOW; why = `${steps.toLocaleString("es-AR")} pasos`; }

      if(to === from) continue;                         // idempotencia

      if(origin === ORIGIN.MANUAL){
        plan.push({ date, hid:h.id, from, to, steps, why, action:"informar", ask:false,
                    note:"Lo marcaste vos. No se cambia." });
        continue;
      }
      if(to === ST.YELLOW && prevIsYellow(date, h.id)){
        ask = true; why += " — sería el segundo amarillo seguido";
      }
      plan.push({ date, hid:h.id, from, to, steps, why, action:"proponer", ask,
                  note: origin === ORIGIN.AUTO ? "Lo había cerrado la app sola." : "Estaba sin marcar." });
    }
  }
  return plan.sort((a,b) => a.date < b.date ? -1 : 1);
}

function applyStepImport(S, plan, accepted){
  let n = 0;
  for(const p of plan){
    if(p.action !== "proponer") continue;
    if(!accepted.has(p.date + "|" + p.hid)) continue;
    setMark(p.date, p.hid, p.to);
    markManual(S, p.date, p.hid);      // deja de ser del robot
    n++;
  }
  save();
  return n;
}

/* ---- pasos por día ----
   S.pasos = { "2026-10-13": 7421 }. Health Connect manda: pisa lo guardado
   (Samsung Health a veces recalcula un día). El CSV de Samsung solo completa o
   sube. Un día sin registro no es un día con 0 pasos: no entra en el promedio. */
/* Una sola meta de pasos: la de la pestaña Pasos y la que marca el hábito de
   pasos ("Caminar seguido"). Se cambia en Pasos; sin tocar, 8000. Vale de lunes
   a viernes: fines de semana y feriados (esLibre) no tienen meta. */
const META_PASOS = 8000;
function metaPasos(S){ return S.settings?.metaPasos || META_PASOS; }
function mezclarPasos(S, porDia, fuente){
  if(!S.pasos) S.pasos = {};
  let cambios = 0;
  for(const [d, v] of Object.entries(porDia)){
    const n = Math.round(Number(v));
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d) || !Number.isFinite(n) || n < 0) continue;
    const antes = S.pasos[d];
    const nuevo = fuente === "csv" ? Math.max(antes ?? 0, n) : n;
    if(nuevo !== antes){ S.pasos[d] = nuevo; cambios++; }
  }
  return cambios;
}

/* Semanas de lunes a domingo. vista: "dia" | "semana" | "mes" | "anio" */
function lunesDe(ds){ const d = parseISO(ds); return iso(addDays(d, -((d.getDay() + 6) % 7))); }
function rangoPasos(vista, ref){
  const d = parseISO(ref), y = d.getFullYear(), m = d.getMonth();
  if(vista === "dia") return { desde: ref, hasta: ref };
  if(vista === "semana"){ const l = lunesDe(ref); return { desde: l, hasta: iso(addDays(parseISO(l), 6)) }; }
  if(vista === "mes") return { desde: iso(new Date(y, m, 1)), hasta: iso(new Date(y, m + 1, 0)) };
  return { desde: iso(new Date(y, 0, 1)), hasta: iso(new Date(y, 11, 31)) };
}
function moverPasos(vista, ref, n){
  const d = parseISO(ref);
  if(vista === "dia") return iso(addDays(d, n));
  if(vista === "semana") return iso(addDays(d, 7 * n));
  if(vista === "mes") return iso(new Date(d.getFullYear(), d.getMonth() + n, 1));
  return iso(new Date(d.getFullYear() + n, 0, 1));
}

/* Total, promedio diario, días con meta y mejor día entre desde y hasta.
   El día en curso suma al total pero no al promedio (sigue sumando pasos),
   salvo que sea el único día con dato. libre(ds) dice qué días no tienen meta:
   suman al total y al promedio, pero no a "días con meta" (conMeta / habiles). */
function resumenPasos(pasos, desde, hasta, meta, hoy, libre = () => false){
  let total = 0, dias = 0, conMeta = 0, habiles = 0, mejor = null;
  const serie = [];
  for(let d = parseISO(desde); iso(d) <= hasta; d = addDays(d, 1)){
    const ds = iso(d), sinMeta = libre(ds);
    const n = ds <= hoy ? pasos?.[ds] ?? null : null;
    serie.push({ fecha: ds, pasos: n, libre: sinMeta });
    if(n == null) continue;
    total += n; dias++;
    if(!sinMeta){ habiles++; if(n >= meta) conMeta++; }
    if(!mejor || n > mejor.pasos) mejor = { fecha: ds, pasos: n };
  }
  const deHoy = desde <= hoy && hoy <= hasta ? pasos?.[hoy] : undefined;
  const cerrados = deHoy != null && dias > 1 ? dias - 1 : dias;
  const base = deHoy != null && dias > 1 ? total - deHoy : total;
  return { total, dias, conMeta, habiles, mejor, serie,
           promedio: cerrados ? Math.round(base / cerrados) : 0, diasPromedio: cerrados };
}
/* Plan B si Health Connect no devuelve la suma por día: suma los registros
   sueltos por día local, de una sola app (la que más pasos tiene), para no
   contar dos veces lo mismo si escriben el celular y el reloj por separado. */
function pasosDeRegistros(registros){
  const porApp = {};
  for(const r of registros || []){
    const n = Number(r?.value), t = new Date(r?.startDate);
    if(!Number.isFinite(n) || isNaN(t)) continue;
    const app = r.sourceBundleId || "?", dias = porApp[app] ||= {}, d = iso(t);
    dias[d] = (dias[d] || 0) + n;
  }
  let app = null, max = -1;
  for(const [a, dias] of Object.entries(porApp)){
    const total = Object.values(dias).reduce((x, y) => x + y, 0);
    if(total > max){ max = total; app = a; }
  }
  return { porDia: app ? porApp[app] : {}, app, apps: Object.keys(porApp) };
}

/* Un resumen por mes del año: lo que dibuja la vista Año. */
function resumenAnual(pasos, anio, meta, hoy, libre){
  return Array.from({ length: 12 }, (_, m) =>
    Object.assign({ mes: m }, resumenPasos(pasos, iso(new Date(anio, m, 1)), iso(new Date(anio, m + 1, 0)), meta, hoy, libre)));
}

/* "Caminar seguido" es caminar la meta de pasos: llegar en un día hábil lo
   marca solo en verde (como marca de la app, no tuya). Lo que marcaste vos no
   se toca, un día libre no se mide y quedarse corto no marca nada: los
   amarillos se revisan a mano (planStepImport). Devuelve los días marcados. */
function marcarPorPasos(S, hoy){
  const h = S.habits.find(x => x.auto?.source === "steps");
  if(!h) return [];
  const meta = metaPasos(S), marcados = [];
  for(const [d, n] of Object.entries(S.pasos || {})){
    if(d > hoy || (S.createdAt && d < S.createdAt) || esLibre(d) || n < meta) continue;
    if(getMark(d, h.id) === ST.GREEN || originOf(S, d, h.id) === ORIGIN.MANUAL) continue;
    setMark(d, h.id, ST.GREEN);
    if(!(S.autoClosed?.[d] || []).includes(h.id)) markAutoClosed(S, d, h.id);
    marcados.push(d);
  }
  return marcados.sort();
}

/* ---- comida: metas de calorías y proteína ----
   S.perfil = { sexo: "h"|"m", edad, altura (cm), peso (kg), pesoMeta, ritmo (kg/semana), actividad }
   Gasto base con Mifflin-St Jeor, por la actividad; para bajar se resta lo que
   pide el ritmo (7.700 kcal por kilo), con un piso de seguridad. Proteína: 1,8 g
   por kilo, para bajar grasa sin perder músculo. */
const ACTIVIDAD = [[1.2, "Sedentaria"], [1.375, "Liviana (1 a 3 días de ejercicio)"],
                   [1.55, "Moderada (3 a 5 días)"], [1.725, "Intensa (6 o 7 días)"]];
function perfilCompleto(p){
  return !!p && (p.sexo === "h" || p.sexo === "m") && [p.edad, p.altura, p.peso, p.pesoMeta, p.ritmo, p.actividad]
    .every(x => Number.isFinite(x) && x > 0);
}
function metasNutricion(p){
  if(!perfilCompleto(p)) return null;
  const tmb = 10 * p.peso + 6.25 * p.altura - 5 * p.edad + (p.sexo === "h" ? 5 : -161);
  const gasto = tmb * p.actividad;
  const bajar = p.peso > p.pesoMeta;
  const deficit = bajar ? p.ritmo * 7700 / 7 : 0;
  const piso = p.sexo === "h" ? 1500 : 1200;
  return {
    tmb: Math.round(tmb), gasto: Math.round(gasto), deficit: Math.round(deficit),
    kcal: Math.max(piso, Math.round((gasto - deficit) / 10) * 10),
    prot: Math.round(1.8 * p.peso / 5) * 5,
    faltan: Math.max(0, Math.round((p.peso - p.pesoMeta) * 10) / 10),
    semanas: bajar ? Math.ceil((p.peso - p.pesoMeta) / p.ritmo) : 0
  };
}
/* S.comidas = { "2026-10-12": [{ id, hora, nombre, kcal, prot, origen, tipo }] }
   S.frecuentes = [{ id, tipo, nombre, kcal, prot }]: lo que se come seguido, a un toque */
function totalComidas(lista){
  return (lista || []).reduce((t, c) => ({ kcal: t.kcal + (c.kcal || 0), prot: t.prot + (c.prot || 0) }), { kcal: 0, prot: 0 });
}
/* Lo que devuelve Claude, a números confiables: nada negativo ni absurdo */
function normalizarAnalisis(r){
  const num = (x, max) => { const n = Number(x); return Number.isFinite(n) && n >= 0 ? Math.min(Math.round(n), max) : 0; };
  const items = (Array.isArray(r?.items) ? r.items : []).filter(i => i && typeof i.nombre === "string" && i.nombre.trim())
    .map(i => ({ nombre: i.nombre.trim().slice(0, 60), porcion: String(i.porcion || "").slice(0, 60),
                 kcal: num(i.kcal, 5000), prot: num(i.proteina_g, 400) }));
  return { items, nota: String(r?.nota || "").slice(0, 300), confianza: ["alta", "media", "baja"].includes(r?.confianza) ? r.confianza : "baja" };
}

/* ---- cintura ----
   La relación cintura/altura sana es menos de 0,5: la cintura, menos de media
   altura. S.cinturas = { "2026-10-18": 95 }; la última también va en perfil.cintura. */
function cinturaAltura(cm, altura){
  if(!(cm > 0 && altura > 0)) return null;
  return { ratio: Math.round(cm / altura * 100) / 100, sana: Math.floor(altura / 2) };
}
/* Cuánto cambió desde la primera medida; null si hay una sola */
function cambioCintura(cinturas){
  const d = Object.keys(cinturas || {}).sort();
  if(d.length < 2) return null;
  return { desde: d[0], cambio: Math.round((cinturas[d.at(-1)] - cinturas[d[0]]) * 10) / 10 };
}

/* Meta de cintura: media altura. Cuándo se llega sale de lo que viene bajando
   (con al menos dos semanas entre la primera y la última medida) o, si todavía
   no, del ritmo de peso: ~0,9 cm de cintura por kilo. Entre 0,15 y 0,75 cm por
   semana para no prometer de más con el agua de las primeras semanas. Las
   fechas se cuentan desde la última medida. */
const HITOS_CINTURA = [0.55, 0.525];
function metaCintura(cinturas, altura, ritmoKg){
  const d = Object.keys(cinturas || {}).sort();
  if(!d.length || !(altura > 0)) return null;
  const actual = cinturas[d.at(-1)], objetivo = Math.floor(altura / 2);
  if(actual <= objetivo) return { actual, objetivo, faltan: 0, llego: true };
  const dias = (parseISO(d.at(-1)) - parseISO(d[0])) / 864e5, bajo = cinturas[d[0]] - actual;
  const medido = dias >= 14 && bajo > 0;
  const porSemana = Math.min(0.75, Math.max(0.15, medido ? bajo / (dias / 7) : (ritmoKg || 0.5) * 0.9));
  const cuando = cm => iso(addDays(parseISO(d.at(-1)), Math.ceil((actual - cm) / porSemana) * 7));
  const hito = HITOS_CINTURA.map(r => Math.round(altura * r)).find(cm => cm < actual && cm > objetivo);
  return { actual, objetivo, faltan: Math.round((actual - objetivo) * 10) / 10, llego: false, medido,
           porSemana: Math.round(porSemana * 100) / 100, fecha: cuando(objetivo), hito: hito ? { cm: hito, fecha: cuando(hito) } : null };
}

/* ---- tipo de comida ----
   Las cuatro del día más la colación, que no cuenta para el aviso. Si la
   comida no trae tipo (las viejas), sale de la hora: antes de las 11 desayuno,
   hasta las 16:30 almuerzo, hasta las 20:30 merienda, después cena. */
const TIPOS_COMIDA = { desayuno: "Desayuno", almuerzo: "Almuerzo", merienda: "Merienda", cena: "Cena", colacion: "Colación" };
const COMIDAS_DEL_DIA = ["desayuno", "almuerzo", "merienda", "cena"];
function tipoPorHora(hora){
  if(!esHora(hora)) return null;
  const m = minutos(hora);
  return m < 300 ? "cena" : m < 660 ? "desayuno" : m < 990 ? "almuerzo" : m < 1230 ? "merienda" : "cena";
}
function tipoDe(c){ return TIPOS_COMIDA[c?.tipo] ? c.tipo : tipoPorHora(c?.hora) || "colacion"; }
function faltanComidas(lista){
  const hay = new Set((lista || []).map(tipoDe));
  return COMIDAS_DEL_DIA.filter(t => !hay.has(t));
}
/* "el desayuno", "la merienda y la cena" */
function nombresComidas(tipos){
  const art = t => (t === "merienda" || t === "cena" ? "la " : "el ") + TIPOS_COMIDA[t].toLowerCase();
  const l = tipos.map(art);
  return l.length > 1 ? l.slice(0, -1).join(", ") + " y " + l.at(-1) : l[0] || "";
}
/* Aviso de comidas: a la hora elegida, cada día de los próximos `dias`, si falta
   alguna de las cuatro. Hoy dice cuáles; los días que vienen todavía no tienen
   nada cargado, y al abrir la app ese día se reprograma con lo que falte. */
function planAvisoComidas(comidas, ahora, dias, hora){
  if(!esHora(hora)) return [];
  const [hh, mm] = hora.split(":").map(Number), out = [];
  for(let i = 0; i < dias; i++){
    const d = addDays(ahora, i), ds = iso(d);
    const at = new Date(d.getFullYear(), d.getMonth(), d.getDate(), hh, mm);
    if(at <= ahora) continue;
    const faltan = faltanComidas(comidas?.[ds]);
    if(!faltan.length) continue;
    out.push({ id: 500000 + i, at, canal: "comidas",
               title: faltan.length === COMIDAS_DEL_DIA.length ? "No cargaste ninguna comida hoy" : "Falta cargar " + nombresComidas(faltan),
               body: "Tocá para ver qué pasó" });
  }
  return out;
}

/* ---- horarios ----
   Cada hábito puede tener h.hora ("07:15") y h.hasta ("08:00"). */
const HORA = /^([01]\d|2[0-3]):[0-5]\d$/;
function esHora(x){ return typeof x === "string" && HORA.test(x); }
function minutos(hhmm){ const [h,m] = hhmm.split(":").map(Number); return h*60 + m; }
function horario(h){ return h.hora ? h.hora + (h.hasta ? "–" + h.hasta : "") : ""; }
/* El día se lee de arriba abajo: primero los que tienen hora, después el resto en su orden */
function porHora(habits){
  return [...habits].sort((a,b) =>
    (a.hora ? minutos(a.hora) : 1e4) - (b.hora ? minutos(b.hora) : 1e4) || (a.order ?? 0) - (b.order ?? 0));
}
/* ¿Estamos dentro del bloque del hábito? Sin "hasta" el bloque dura 15 minutos;
   si "hasta" es menor que "hora", el bloque cruza la medianoche. */
function esAhora(h, ahora){
  if(!h.hora) return false;
  const ini = minutos(h.hora);
  let fin = h.hasta && h.hasta !== h.hora ? minutos(h.hasta) : ini + 15;
  if(fin <= ini) fin += 1440;
  return (ahora >= ini && ahora < fin) || (ahora + 1440 >= ini && ahora + 1440 < fin);
}

/* ---- lo que quedó sin marcar ----
   Lo de anoche (magnesio, leer, acostarse) se confirma a la mañana siguiente,
   pero a esa hora el cierre automático ya lo dejó en sin dato. Esto devuelve el
   último día hábil, si fue hace 3 días o menos, con sus hábitos sin dato. */
function pendientes(hoy){
  for(let i = 1; i <= 3; i++){
    const ds = iso(addDays(parseISO(hoy), -i));
    if(esLibre(ds)) continue;
    const hs = porHora(S.habits.filter(h => getMark(ds, h.id) === ST.NODATA));
    return hs.length ? { date: ds, habits: hs } : null;
  }
  return null;
}

/* ---- avisos de la app de Android ----
   Un aviso por horario (los hábitos a la misma hora van juntos) para los
   próximos `dias` días, solo días hábiles: ni fines de semana ni feriados.
   De hoy saltea lo que ya pasó y lo que ya está marcado. El id es único por
   día y horario, y entra de sobra en 32 bits: día * 10000 + HHMM. */
function planAvisos(habits, ahora, dias, hechosHoy){
  const grupos = new Map();
  for(const h of porHora(habits.filter(h => esHora(h.hora)))){
    if(!grupos.has(h.hora)) grupos.set(h.hora, []);
    grupos.get(h.hora).push(h);
  }
  const hoy = iso(ahora), out = [];
  for(let i = 0; i < dias; i++){
    const d = addDays(ahora, i), ds = iso(d);
    if(esLibre(ds)) continue;
    for(const [hora, hs] of grupos){
      const [hh, mm] = hora.split(":").map(Number);
      const at = new Date(d.getFullYear(), d.getMonth(), d.getDate(), hh, mm);
      if(at <= ahora) continue;
      const faltan = ds === hoy ? hs.filter(h => !hechosHoy.has(h.id)) : hs;
      if(!faltan.length) continue;
      out.push({ id: i * 10000 + hh * 100 + mm, at,
                 title: faltan.map(h => h.name).join(" · "),
                 body: (faltan.length === 1 ? horario(faltan[0]) : hora) + " · Tocá para marcarlo" });
    }
  }
  return out;
}

/* ---- recordatorios como calendario (.ics) ----
   Una PWA sin servidor no puede programar notificaciones con la app cerrada;
   un calendario sí. Un evento por horario (los hábitos a la misma hora van
   juntos), de lunes a viernes, salteando feriados, con aviso al empezar.
   Las horas llevan la zona horaria explícita: sin ella cada calendario las
   interpreta a su manera. */
function offsetDe(tz, fecha){                  // "GMT-03:00" -> "-0300"
  const n = new Intl.DateTimeFormat("en-US", { timeZone: tz, timeZoneName: "longOffset" })
    .formatToParts(fecha).find(p => p.type === "timeZoneName").value;
  const m = /([+-])(\d{2}):(\d{2})/.exec(n);
  return m ? m[1] + m[2] + m[3] : "+0000";
}
function generarICS(habits, desde, url, feriados, ahora, tz){
  const grupos = new Map();
  for(const h of porHora(habits.filter(h => esHora(h.hora)))){
    if(!grupos.has(h.hora)) grupos.set(h.hora, []);
    grupos.get(h.hora).push(h);
  }
  const libresSet = new Set(feriados);
  let ini = parseISO(desde);
  while(isWeekend(iso(ini)) || libresSet.has(iso(ini))) ini = addDays(ini, 1);   // el primer evento cae en día hábil
  const dia = d => iso(d).replace(/-/g, "");
  const hhmm = m => String(Math.floor(m / 60)).padStart(2, "0") + String(m % 60).padStart(2, "0") + "00";
  const texto = t => t.replace(/[\\;,]/g, c => "\\" + c).replace(/\r?\n|\r/g, "\\n");
  const octetos = ch => { const c = ch.codePointAt(0); return c < 0x80 ? 1 : c < 0x800 ? 2 : c < 0x10000 ? 3 : 4; };
  const doblar = linea => {                 // RFC 5545: líneas de hasta 75 octetos
    let out = "", tramo = "", n = 0, max = 75;
    for(const ch of linea){
      if(n + octetos(ch) > max){ out += tramo + "\r\n "; tramo = ""; n = 0; max = 74; }
      tramo += ch; n += octetos(ch);
    }
    return out + tramo;
  };
  const libres = [...libresSet].filter(ds => ds >= iso(ini) && !isWeekend(ds)).sort();
  const sello = (ahora || new Date()).toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Mi Prime//Recordatorios//ES",
             "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:Mi Prime"];
  /* Zona sin horario de verano (como Argentina): se describe entera. Con horario
     de verano, se deja solo el nombre IANA, que los calendarios ya conocen. */
  const enero = offsetDe(tz, new Date(ini.getFullYear(), 0, 15)), julio = offsetDe(tz, new Date(ini.getFullYear(), 6, 15));
  if(enero === julio){
    L.push("X-WR-TIMEZONE:" + tz, "BEGIN:VTIMEZONE", "TZID:" + tz, "BEGIN:STANDARD", "DTSTART:19700101T000000",
           "TZOFFSETFROM:" + enero, "TZOFFSETTO:" + enero, "END:STANDARD", "END:VTIMEZONE");
  }
  const conZona = ";TZID=" + tz + ":";
  for(const [hora, hs] of grupos){
    const desdeMin = minutos(hora);
    let finMin = Math.max(...hs.map(h => {
      const f = esHora(h.hasta) && h.hasta !== hora ? minutos(h.hasta) : desdeMin + 15;
      return f <= desdeMin ? f + 1440 : f;
    }));
    const finDia = finMin >= 1440 ? addDays(ini, 1) : ini;
    finMin %= 1440;
    const nombres = hs.map(h => h.name).join(" · ");
    L.push("BEGIN:VEVENT",
      "UID:mi-prime-" + hora.replace(":", "") + "@mi-prime",
      "DTSTAMP:" + sello,
      "DTSTART" + conZona + dia(ini) + "T" + hhmm(desdeMin),
      "DTEND" + conZona + dia(finDia) + "T" + hhmm(finMin),
      "RRULE:FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR");
    if(libres.length) L.push("EXDATE" + conZona + libres.map(ds => ds.replace(/-/g, "") + "T" + hhmm(desdeMin)).join(","));
    L.push("SUMMARY:" + texto(nombres),
      "DESCRIPTION:" + texto("Marcalo en Mi Prime: " + url),
      "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + texto(nombres), "TRIGGER:PT0S", "END:VALARM",
      "END:VEVENT");
  }
  L.push("END:VCALENDAR");
  return L.map(doblar).join("\r\n") + "\r\n";
}

/* Dos frases por día, una a la mañana y otra a la tarde, sacadas de un mazo
   mezclado: no se repite ninguna hasta pasar por todas (8 días con 16), y al
   volver a mezclar la primera nunca es la última del mazo anterior. Sale de la
   fecha, así que no hay nada que guardar y es la misma en todos lados. */
function mezcla(n, semilla){
  let a = semilla >>> 0;
  const azar = () => {                       // mulberry32
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), a | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const p = [...Array(n).keys()];
  for(let i = n - 1; i > 0; i--){ const j = Math.floor(azar() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  return p;
}
function mazo(ciclo, n){
  const p = mezcla(n, Math.imul(ciclo, 2654435761) + 12345);
  if(n > 1 && p[0] === mezcla(n, Math.imul(ciclo - 1, 2654435761) + 12345)[n - 1]) [p[0], p[1]] = [p[1], p[0]];
  return p;
}
function fraseDelDia(fecha, tarde = false){ return deLaRueda(REFLEXIONES, fecha, tarde); }
function deLaRueda(lista, fecha, tarde){
  const k = lista.length, turno = Math.round(parseISO(fecha).getTime() / 864e5) * 2 + (tarde ? 1 : 0);
  const ciclo = Math.floor(turno / k), pos = turno - ciclo * k;
  return lista[mazo(ciclo, k)[pos]];
}
/* Lo que se está cocinando: todas las marcas en verde y desde cuándo */
function loQueSeCocina(S){
  let verdes = 0, desde = null;
  for(const [d, m] of Object.entries(S.marks || {}))
    for(const st of Object.values(m)) if(st === ST.GREEN){ verdes++; if(!desde || d < desde) desde = d; }
  return { verdes, desde };
}

/* ---- finanzas ----
   S.finanzas = {
     inicio: "2026-11",               primer mes del plan: antes no se cuenta ni se avisa nada
     presupuestoAlimentos: 600000,
     ingresos:    [{ id, nombre, monto, dia?, meses? }]    meses: [6, 12] para el aguinaldo; sin meses, todos
     fijos:       [{ id, nombre, monto, dia? }]            lo de la casa que se paga todos los meses
     deudas:      [{ id, nombre, saldo, cuota, tna?, dia?, hasta?, plan? }]   plan: { "2026-11": 527360 } si una cuota es distinta
     movimientos: [{ id, mes, nombre, monto }]             lo de un solo mes: + entra (un adelanto), − sale (su descuento)
     colchon:     [{ id, nombre, monto }]                  lo ahorrado, hoy
     gastos:      { "2026-11-02": [{ id, comercio, total, items?, origen, nota? }] }   alimentos
     pagos:       { "2026-11": ["d:id", "f:id"] }          vencimientos del mes ya pagados
   }
   Todo en pesos; un mes es "AAAA-MM". Un sueldo cuenta para el mes que paga: el
   que se cobra el 30 de octubre es plata de noviembre. */
const PRESUPUESTO_ALIMENTOS = 600000;
function mesDe(ds){ return ds.slice(0, 7); }
function sumarMeses(mes, n){ const [y, m] = mes.split("-").map(Number); return iso(new Date(y, m - 1 + n, 1)).slice(0, 7); }
/* El día de pago dentro del mes: el 31 en noviembre cae el 30 */
function fechaDelMes(mes, dia){ const [y, m] = mes.split("-").map(Number); return iso(new Date(y, m - 1, Math.min(dia, daysInMonth(y, m - 1)))); }
function cuotaDelMes(d, mes){ return d.hasta && mes > d.hasta ? 0 : d.plan?.[mes] ?? d.cuota ?? 0; }
function ingresoDelMes(i, mes){ return !i.meses?.length || i.meses.includes(Number(mes.slice(5))) ? i.monto || 0 : 0; }
function presupuestoAlimentos(F){ return F?.presupuestoAlimentos ?? PRESUPUESTO_ALIMENTOS; }
const suma = (lista, f) => (lista || []).reduce((t, x) => t + (f(x) || 0), 0);
/* Los gastos del mes en orden de fecha, con su día y su lugar en la lista de ese día */
function gastosDelMes(gastos, mes){
  return Object.keys(gastos || {}).filter(d => mesDe(d) === mes).sort()
    .flatMap(d => gastos[d].map((g, i) => ({ g, fecha: d, i })));
}
function gastadoEnMes(gastos, mes){ return suma(gastosDelMes(gastos, mes), x => x.g.total); }
function gastoMensual(F){ return suma(F?.fijos, f => f.monto) + presupuestoAlimentos(F); }
function totalColchon(F){ return suma(F?.colchon, c => c.monto); }

/* Lo que entra y lo que sale en un mes. Alimentos: en un mes pasado, lo gastado;
   en este y en los que vienen, el presupuesto, o lo gastado si ya se pasó. */
function resumenMes(F, mes, hoy){
  const ingresos = (F?.ingresos || []).map(i => ({ nombre: i.nombre, monto: ingresoDelMes(i, mes) })).filter(i => i.monto);
  const movimientos = (F?.movimientos || []).filter(m => m.mes === mes);
  const presupuesto = presupuestoAlimentos(F), gastado = gastadoEnMes(F?.gastos, mes);
  const casa = suma(F?.fijos, f => f.monto), cuotas = suma(F?.deudas, d => cuotaDelMes(d, mes));
  const alimentos = mes < mesDe(hoy) ? gastado : Math.max(presupuesto, gastado);
  const entra = suma(ingresos, i => i.monto) + suma(movimientos, m => Math.max(0, m.monto));
  const otros = suma(movimientos, m => Math.max(0, -m.monto));
  return { mes, entra, casa, alimentos, presupuesto, gastado, cuotas, otros, ingresos, movimientos,
           sobra: entra - casa - alimentos - cuotas - otros };
}
/* Mes a mes desde `desde`: cuánto sobra y cómo queda el colchón si se guarda lo que sobra
   (y si falta, sale de ahí) */
function proyeccionFinanzas(F, desde, n, hoy){
  let colchon = totalColchon(F);
  return Array.from({ length: n }, (_, k) => {
    const r = resumenMes(F, sumarMeses(desde, k), hoy);
    colchon += r.sobra;
    return { ...r, colchon };
  });
}
/* Colchón de 1, 3 y 6 meses de gastos: si ya está, o en qué mes se llega (mirando hasta 3 años) */
const HITOS_COLCHON = [1, 3, 6];
function hitosColchon(F, desde, hoy){
  const gasto = gastoMensual(F), hay = totalColchon(F), p = proyeccionFinanzas(F, desde, 36, hoy);
  return HITOS_COLCHON.map(meses => {
    const monto = meses * gasto;
    return hay >= monto ? { meses, monto, ya: true } : { meses, monto, ya: false, mes: p.find(x => x.colchon >= monto)?.mes || null };
  });
}

/* Lo que hay que pagar en el mes, por día: cuotas y gastos fijos. Los que no
   tienen día van al final. */
function vencimientos(F, mes){
  const pagos = new Set(F?.pagos?.[mes] || []);
  return [
    ...(F?.deudas || []).map(d => ({ clave: "d:" + d.id, nombre: d.nombre, monto: cuotaDelMes(d, mes), dia: d.dia, tipo: "cuota" })),
    ...(F?.fijos || []).map(f => ({ clave: "f:" + f.id, nombre: f.nombre, monto: f.monto || 0, dia: f.dia, tipo: "fijo" }))
  ].filter(v => v.monto > 0)
   .map(v => ({ ...v, fecha: v.dia ? fechaDelMes(mes, v.dia) : null, pagado: pagos.has(v.clave) }))
   .sort((a, b) => (a.dia || 99) - (b.dia || 99));
}
/* Lo que vence ese día y todavía no se pagó. Antes del primer mes del plan, nada. */
function vencenEl(F, ds){
  const mes = mesDe(ds);
  if(F?.inicio && mes < F.inicio) return [];
  return vencimientos(F, mes).filter(v => v.fecha === ds && !v.pagado);
}
/* Aviso el día antes de cada vencimiento, a la hora elegida, con lo que todavía no
   se pagó; los del mismo día van juntos. Hoy lleva su propio id por día. */
function planAvisoVencimientos(F, ahora, dias, hora){
  if(!F || !esHora(hora)) return [];
  const [hh, mm] = hora.split(":").map(Number), out = [];
  for(let i = 0; i < dias; i++){
    const d = addDays(ahora, i), at = new Date(d.getFullYear(), d.getMonth(), d.getDate(), hh, mm);
    if(at <= ahora) continue;
    const v = vencenEl(F, iso(addDays(d, 1)));
    if(!v.length) continue;
    out.push({ id: 600000 + i, at, canal: "finanzas",
               title: "Mañana vence " + (v.length === 1 ? v[0].nombre : `${v[0].nombre} y ${v.length === 2 ? "1 más" : v.length - 1 + " más"}`),
               body: `$ ${suma(v, x => x.monto).toLocaleString("es-AR")} · Tocá para verlo` });
  }
  return out;
}

/* Lo que queda del presupuesto de alimentos, repartido en lo que falta del mes (hoy incluido) */
function ritmoAlimentos(presupuesto, gastado, mes, hoy){
  const quedan = presupuesto - gastado;
  if(mes !== mesDe(hoy)) return { quedan, dias: 0, porSemana: 0 };
  const [y, m] = mes.split("-").map(Number), dias = daysInMonth(y, m - 1) - parseISO(hoy).getDate() + 1;
  return { quedan, dias, porSemana: quedan > 0 ? Math.round(quedan / dias * 7 / 100) * 100 : 0 };
}
/* Cuotas que faltan desde `mes` hasta la última, las dos incluidas */
function cuotasQueFaltan(d, mes){
  if(!d.hasta) return null;
  const [y1, m1] = mes.split("-").map(Number), [y2, m2] = d.hasta.split("-").map(Number);
  return Math.max(0, (y2 - y1) * 12 + m2 - m1 + 1);
}
/* Deudas que siguen en `mes`: lo que se debe y cuánto se va en intereses por mes
   (sin IVA). Tasa 0 es sin interés; sin tasa, no se sabe y no se cuenta. */
function resumenDeudas(F, mes){
  const activas = (F?.deudas || []).filter(d => !d.hasta || d.hasta >= mes);
  return { activas, saldo: suma(activas, d => d.saldo),
           intereses: Math.round(suma(activas, d => d.tna ? d.saldo * d.tna / 1200 : 0)),
           sinTasa: activas.filter(d => d.tna == null).length };
}

/* Lo que devuelve Claude de un ticket, a números confiables. Los descuentos
   vienen como renglones negativos; si falta el total, es la suma de los renglones. */
function normalizarTicket(r){
  const plata = (x, min) => { const n = Number(x); return Number.isFinite(n) ? Math.max(min, Math.min(Math.round(n), 1e9)) : 0; };
  const items = (Array.isArray(r?.items) ? r.items : []).filter(i => i && typeof i.nombre === "string" && i.nombre.trim())
    .map(i => ({ nombre: i.nombre.trim().slice(0, 60), cantidad: Math.min(Math.max(Number(i.cantidad) || 1, 0), 1000), precio: plata(i.precio, -1e9) }));
  const fecha = typeof r?.fecha === "string" && /^\d{4}-\d{2}-\d{2}$/.test(r.fecha) && iso(parseISO(r.fecha)) === r.fecha ? r.fecha : "";
  return { comercio: String(r?.comercio || "").trim().slice(0, 60), fecha, items,
           total: plata(r?.total, 0) || Math.max(0, suma(items, i => i.precio)),
           nota: String(r?.nota || "").slice(0, 300), confianza: ["alta", "media", "baja"].includes(r?.confianza) ? r.confianza : "baja" };
}

/* ---- hábitos de finanzas ----
   Se marcan solos con lo que se carga en Finanzas, como "Caminar seguido" con
   los pasos: h.auto = { source: "finanzas", regla, desde }. Lo que marcaste vos
   no se toca. Lo que marcó la app queda anotado en S.marcasFin, así se puede
   cambiar si cambian los datos (un ticket de ayer, un pago marcado tarde). La
   plata no tiene fin de semana: se miran todos los días. */
const HABITOS_FINANZAS = {
  anotar:       { nombre: "Anotar lo que gasto", hora: "21:00",
                  que: "Verde el día que cargás un gasto de alimentos. Si no gastaste, lo marcás vos. A las 21 te avisa si no anotaste." },
  sinDeuda:     { nombre: "Sin deuda nueva", que: "Verde cada día; amarillo el día que cargás una deuda nueva o un adelanto." },
  ritmo:        { nombre: "Alimentos al ritmo", que: "Verde mientras lo gastado en el mes no se adelanta más de una semana al presupuesto." },
  vencimientos: { nombre: "Vencimientos al día", que: "Verde si no hay ninguna cuota ni gasto vencido sin marcar como pagado." }
};
/* Lo que se puede haber gastado en alimentos hasta ese día: el presupuesto del
   mes repartido por día, con una semana de margen para la compra grande */
function topeRitmo(presupuesto, ds){
  const d = parseISO(ds), dim = daysInMonth(d.getFullYear(), d.getMonth());
  return Math.round(presupuesto * Math.min(1, (d.getDate() + 7) / dim));
}
function gastadoHasta(gastos, ds){ return suma(gastosDelMes(gastos, mesDe(ds)).filter(x => x.fecha <= ds), x => x.g.total); }
function deudaNuevaEl(F, ds){ return [...(F?.deudas || []), ...(F?.movimientos || []).filter(m => m.deuda)].some(x => x.alta === ds); }
/* ¿Hay algo de este mes o del anterior que ya venció y no está marcado como pagado? */
function vencidoSinPagar(F, hoy){
  return [sumarMeses(mesDe(hoy), -1), mesDe(hoy)].some(mes => !(F?.inicio > mes)
    && vencimientos(F, mes).some(v => v.fecha && v.fecha < hoy && !v.pagado));
}
/* Lo que dice la regla de un día: verde, amarillo, null (no se marca solo) o
   undefined (no se mira: los vencimientos de días pasados quedan como estaban) */
function estadoFinanzas(F, regla, ds, hoy){
  if(regla === "anotar") return F?.gastos?.[ds]?.length ? ST.GREEN : null;
  if(regla === "sinDeuda") return deudaNuevaEl(F, ds) ? ST.YELLOW : ST.GREEN;
  if(regla === "ritmo") return gastadoHasta(F?.gastos, ds) <= topeRitmo(presupuestoAlimentos(F), ds) ? ST.GREEN : ST.YELLOW;
  if(regla === "vencimientos") return ds !== hoy ? undefined : vencidoSinPagar(F, hoy) ? ST.YELLOW : ST.GREEN;
  return null;
}
/* Marca los hábitos de finanzas desde que se sumaron hasta hoy; devuelve cuántas marcas cambió */
function marcarPorFinanzas(S, hoy){
  let cambios = 0;
  for(const h of S.habits.filter(x => x.auto?.source === "finanzas")){
    for(let d = parseISO(h.auto.desde || hoy); iso(d) <= hoy; d = addDays(d, 1)){
      const ds = iso(d), st = estadoFinanzas(S.finanzas, h.auto.regla, ds, hoy);
      if(st === undefined) continue;
      const mia = (S.marcasFin?.[ds] || []).includes(h.id);
      if(!mia && originOf(S, ds, h.id) === ORIGIN.MANUAL) continue;      // lo marcaste vos
      if(st === null){
        if(!mia) continue;
        sacarDe(S.marcasFin, ds, h.id);                                  // queda como lo deja el cierre automático
        if(ds === hoy) setMark(ds, h.id, null);
        else { setMark(ds, h.id, esLibre(ds) ? ST.BLUE : ST.YELLOW); markAutoClosed(S, ds, h.id); }
        cambios++;
        continue;
      }
      if(mia && getMark(ds, h.id) === st) continue;
      setMark(ds, h.id, st);
      sacarDe(S.autoClosed, ds, h.id);
      if(!mia) ((S.marcasFin ||= {})[ds] ||= []).push(h.id);
      cambios++;
    }
  }
  return cambios;
}

/* ---- a dónde vas: lo que dicen tus números, para armar las frases ---- */
const FRASES_FINANZAS = [
  { t: "Nunca una deuda para pagar otra." },
  { t: "Lo que no se anota, no se controla." },
  { t: "Un mes apretado no rompe el plan: lo corre un poco." },
  { t: "Cada cuota que termina es plata que vuelve a ser tuya." },
  { t: "Un adelanto de sueldo es un préstamo con otro nombre." },
  { t: "La tarjeta se paga entera. El pago mínimo es la puerta de la deuda cara." },
  { t: "El colchón no es plata quieta: es la que te evita pedir prestado." },
  { t: "Primero lo que vence; después lo que se antoja." },
  { t: "No importa cuánto entra: importa cuánto queda." },
  { t: "Antes de comprar en cuotas, preguntate si lo comprarías de contado." },
  { t: "La libertad financiera empieza el día que dejás de deber." },
  { t: "Dos meses ordenados valen más que un mes perfecto." }
];
function fraseFinanzas(fecha, tarde = false){ return deLaRueda(FRASES_FINANZAS, fecha, tarde); }
function rumboFinanzas(F, hoy){
  const mes = F?.inicio > mesDe(hoy) ? F.inicio : mesDe(hoy), p = proyeccionFinanzas(F, mes, 24, hoy);
  const cierraDesde = p[0].sobra < 0 ? p.find((x, i) => i > 0 && p.slice(i, i + 12).every(y => y.sobra >= 0))?.mes || null : null;
  const conFin = (F?.deudas || []).filter(d => d.hasta && d.hasta >= mes), fin = conFin.map(d => d.hasta).sort()[0];
  const terminan = conFin.filter(d => d.hasta === fin);
  const sinFin = (F?.deudas || []).some(d => !d.hasta && d.saldo > 0);
  const v = vencimientos(F, mes);
  return {
    mes, sobra: p[0].sobra, cierraDesde,
    terminan: fin ? { mes: fin, nombres: terminan.map(d => d.nombre), libera: suma(terminan, d => d.cuota || cuotaDelMes(d, fin)) } : null,
    ultima: !sinFin && conFin.length ? conFin.map(d => d.hasta).sort().at(-1) : null,
    cuotas: { ahora: p[0].cuotas, mes: p[6].mes, despues: p[6].cuotas },
    hito: hitosColchon(F, mes, hoy).find(h => !h.ya) || null,
    alimentos: mes === mesDe(hoy) ? { gastado: gastadoHasta(F?.gastos, hoy), presupuesto: presupuestoAlimentos(F), tope: topeRitmo(presupuestoAlimentos(F), hoy) } : null,
    vencimientos: { total: v.length, pagados: v.filter(x => x.pagado).length, falta: suma(v.filter(x => !x.pagado), x => x.monto) }
  };
}

/* =========================================================================
   4. GEOMETRÍA DE LAS RUEDAS
   ========================================================================= */
function polar(cx, cy, r, deg){ const a = (deg - 90) * Math.PI / 180; return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; }
function sector(cx, cy, r0, r1, a0, a1){
  const [x0,y0] = polar(cx,cy,r1,a0), [x1,y1] = polar(cx,cy,r1,a1);
  const [x2,y2] = polar(cx,cy,r0,a1), [x3,y3] = polar(cx,cy,r0,a0);
  const big = (a1 - a0) > 180 ? 1 : 0;
  return `M${x0.toFixed(2)},${y0.toFixed(2)} A${r1},${r1} 0 ${big} 1 ${x1.toFixed(2)},${y1.toFixed(2)}`
       + ` L${x2.toFixed(2)},${y2.toFixed(2)} A${r0},${r0} 0 ${big} 0 ${x3.toFixed(2)},${y3.toFixed(2)} Z`;
}
function fillOf(st){
  return st === ST.GREEN ? "var(--ok)" : st === ST.YELLOW ? "var(--fail)" : st === ST.BLUE ? "var(--free)"
       : st === ST.NODATA ? "var(--nodata)" : "var(--empty)";
}
function texOf(st){
  if(!S.settings.texture) return null;
  return st === ST.YELLOW ? "url(#txY)" : st === ST.BLUE ? "url(#txB)" : null;
}
const DEFS = `<defs>
  <pattern id="txY" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="6" height="6" fill="var(--fail)"/><rect width="2.2" height="6" fill="rgba(0,0,0,.42)"/></pattern>
  <pattern id="txB" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
    <rect width="6" height="6" fill="var(--free)"/><rect width="2.2" height="6" fill="rgba(255,255,255,.5)"/></pattern>
</defs>`;

/* Rueda del mes: 1 anillo por hábito, 1 sector por día */
function monthWheel(y, m){
  const dim = daysInMonth(y,m), hs = habitsSorted();
  const SZ = 340, C = SZ/2, R = 152, HOLE = 46;
  const band = hs.length ? (R - HOLE) / hs.length : 0;
  const step = 360 / dim, gap = Math.min(1.6, step * .18);
  const now = new Date();
  const todayD = (y === now.getFullYear() && m === now.getMonth()) ? now.getDate() : 0;
  let cells = "", labs = "";
  for(let d = 1; d <= dim; d++){
    const ds = iso(new Date(y,m,d));
    const a0 = (d-1)*step + gap/2, a1 = d*step - gap/2;
    hs.forEach((h, i) => {
      const r0 = HOLE + i*band + .9, r1 = HOLE + (i+1)*band - .9;
      const st = getMark(ds, h.id);
      const tx = texOf(st);
      cells += `<path class="cell" d="${sector(C,C,r0,r1,a0,a1)}" fill="${tx||fillOf(st)}" `
            + `stroke="var(--surface)" stroke-width="0.6" data-d="${ds}" data-h="${h.id}">`
            + `<title>${d} · ${esc(h.name)} · ${stName(st)}</title></path>`;
    });
    if(d % 2 === 1 || dim <= 28 || d === todayD){
      const [lx,ly] = polar(C,C,R+11,(d-.5)*step);
      const isT = d === todayD;
      labs += `<text class="daylab" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle"`
           + (isT ? ` style="fill:var(--ink);font-weight:800"` : ``) + `>${d}</text>`;
    }
  }
  let tmark = "";
  if(todayD){
    tmark = `<path d="${sector(C,C,HOLE-3.5,R+3.5,(todayD-1)*step,todayD*step)}" fill="none"
      stroke="var(--ink)" stroke-width="1.7" stroke-linejoin="round" opacity=".9"/>`;
  }
  const c = countRange(y,m,1,dim,null);
  const oblig = c.green + c.yellow + c.nodata;   // el sin dato cuenta como no hecho
  const pct = oblig ? Math.round(c.green / oblig * 100) : 0;
  return `<svg viewBox="-14 -14 ${SZ+28} ${SZ+28}" role="img" aria-label="Rueda del mes">${DEFS}${cells}${tmark}${labs}
    <text class="ctr" x="${C}" y="${C-4}" text-anchor="middle" style="font-size:26px">${pct}%</text>
    <text class="ctr-s" x="${C}" y="${C+13}" text-anchor="middle">PRIME</text></svg>`;
}

/* Rueda de una semana: 1 sector por día del bloque */
function weekWheel(y, m, from, to, hid, label){
  const n = to - from + 1;
  if(n <= 0) return "";
  const SZ = 132, C = SZ/2, R = 56, HOLE = 27;
  const step = 360 / n, gap = 3.2;
  let cells = "";
  for(let k = 0; k < n; k++){
    const d = from + k, ds = iso(new Date(y,m,d));
    const st = getMark(ds, hid), tx = texOf(st);
    cells += `<path class="cell" d="${sector(C,C,HOLE,R,k*step+gap/2,(k+1)*step-gap/2)}" fill="${tx||fillOf(st)}" `
          + `stroke="var(--surface-2)" stroke-width="1" data-d="${ds}" data-h="${hid}">`
          + `<title>${d} · ${stName(st)}</title></path>`;
  }
  const c = countRange(y,m,from,to,hid);
  return `<div class="wk"><h4>${label}</h4>
    <svg viewBox="-4 -4 ${SZ+8} ${SZ+8}">${DEFS}${cells}
      <text class="ctr" x="${C}" y="${C+1}" text-anchor="middle" style="font-size:12px">${from}-${to}</text></svg>
    <div class="vd"><span class="v">VIC ${c.green}</span><span class="d">DER ${c.yellow}</span></div></div>`;
}

function habitsSorted(){ return [...S.habits].sort((a,b)=>(a.order??0)-(b.order??0)); }
function stName(st){ return st===ST.GREEN?"Hecho":st===ST.YELLOW?"No se hizo":st===ST.BLUE?"Libre":st===ST.NODATA?"Sin dato":"Sin marcar"; }
function stGlyph(st){ return st===ST.GREEN?"✓":st===ST.YELLOW?"✕":st===ST.BLUE?"–":st===ST.NODATA?"?":"·"; }
function cap(t){ return t[0].toUpperCase() + t.slice(1); }
/* "ayer", "el viernes" o "el lunes pasado": prevDay() nunca mira más de 7 días atrás */
function diaRelativo(ds){
  const n = diasEntre(ds, TODAY);
  if(n === 1) return "ayer";
  return "el " + DIAS_LARGOS[parseISO(ds).getDay()] + (n >= 7 ? " pasado" : "");
}
