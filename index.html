<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Prime">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Seguimiento diario de hábitos: 31 días para mi prime.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Mi Prime · 31 días</title>
<style>
:root{
  color-scheme: light;
  --bg:#f9f9f7; --surface:#ffffff; --surface-2:#fcfcfb;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --line:#e1e0d9; --ring:rgba(11,11,11,.10);
  --ok:#0ca30c; --ok-soft:#e6f5e6;
  --fail:#fab219; --fail-soft:#fdf1d8;
  --free:#2a78d6; --free-soft:#e4eefb;
  --empty:#eceae3;
  --accent:#0b0b0b;
  --shadow:0 1px 2px rgba(11,11,11,.06),0 8px 24px rgba(11,11,11,.05);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#212120;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --line:#2c2c2a; --ring:rgba(255,255,255,.10);
    --ok:#0ca30c; --ok-soft:#122a12;
    --fail:#fab219; --fail-soft:#332713;
    --free:#3987e5; --free-soft:#132538;
    --empty:#2c2c2a;
    --accent:#ffffff;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#212120;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --line:#2c2c2a; --ring:rgba(255,255,255,.10);
  --ok:#0ca30c; --ok-soft:#122a12;
  --fail:#fab219; --fail-soft:#332713;
  --free:#3987e5; --free-soft:#132538;
  --empty:#2c2c2a;
  --accent:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.45;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
#app{max-width:520px;margin:0 auto;padding:0 14px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.hide{display:none !important}

/* ---------- header ---------- */
header{padding:calc(14px + env(safe-area-inset-top)) 0 8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand h1{font-size:21px}
.brand h1 small{display:block;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);font-size:17px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-t{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}

/* ---------- stat row ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 10px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:25px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.stat span{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- alert ---------- */
.alert{border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:14px;display:flex;gap:10px;align-items:flex-start;line-height:1.35}
.alert.risk{background:var(--fail-soft);border:1px solid var(--fail);color:var(--ink)}
.alert.good{background:var(--ok-soft);border:1px solid var(--ok);color:var(--ink)}
.alert b{font-weight:700}
.alert .ic{font-size:17px;line-height:1.1}

/* ---------- habit rows ---------- */
.hrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:none}
.dot{width:52px;height:52px;min-width:52px;border-radius:17px;display:grid;place-items:center;
  border:2px solid var(--line);background:var(--surface-2);font-size:23px;font-weight:700;color:var(--muted);
  transition:transform .12s ease,background .15s ease,border-color .15s ease}
.dot:active{transform:scale(.9)}
.dot.s-green{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.s-yellow{background:var(--fail);border-color:var(--fail);color:#0b0b0b}
.dot.s-blue{background:var(--free);border-color:var(--free);color:#fff}
.hmeta{flex:1;min-width:0}
.hname{font-size:15.5px;font-weight:600;line-height:1.25}
.hsub{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.hsub .warn{color:var(--fail);font-weight:700}
.more{width:38px;height:38px;min-width:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:19px;border:1px solid transparent}
.more:active{background:var(--surface-2);border-color:var(--line)}

/* ---------- notes ---------- */
textarea,input[type=text],input[type=number]{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;
  padding:11px 12px;color:var(--ink);font:inherit;font-size:15px;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:-1px}

/* ---------- legend ---------- */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:12px}
.legend i{width:13px;height:13px;border-radius:4px;display:inline-block;vertical-align:-2px;margin-right:6px;border:1px solid var(--ring)}

/* ---------- wheel ---------- */
.wheelwrap{width:100%;display:block}
svg{display:block;width:100%;height:auto;overflow:visible}
.cell{cursor:pointer}
.cell:active{opacity:.65}
.daylab{font-size:9.5px;fill:var(--muted);font-weight:600}
.ctr{fill:var(--ink);font-weight:700}
.ctr-s{fill:var(--muted);font-weight:600;font-size:9px;letter-spacing:.1em}

/* ---------- month nav ---------- */
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--shadow)}
.mnav b{font-size:15px;text-transform:capitalize}
.mnav button{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;color:var(--ink-2)}
.mnav button:active{background:var(--surface-2)}

/* ---------- weekly ---------- */
.weeks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wk{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:10px}
.wk h4{margin:0 0 6px;font-size:12px;font-weight:700;text-align:center;letter-spacing:-.01em}
.vd{display:flex;justify-content:center;gap:10px;font-size:11.5px;font-weight:700;margin-top:6px}
.vd .v{color:var(--ok)} .vd .d{color:var(--fail)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed=true]{background:var(--accent);color:var(--bg);border-color:var(--accent)}

/* ---------- lists (hacer más/menos) ---------- */
.li{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.li:last-child{border-bottom:none}
.li .bar{width:4px;height:19px;border-radius:2px;flex:none}
.li span{flex:1}
.li .x{color:var(--muted);font-size:17px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1}
.addrow button{padding:0 16px;border-radius:13px;background:var(--accent);color:var(--bg);font-weight:700;font-size:14px}

/* ---------- table ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:5px 3px;text-align:center;border-bottom:1px solid var(--line)}
.tbl th{color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.tbl td:first-child,.tbl th:first-child{text-align:left;color:var(--ink-2);font-weight:600;white-space:nowrap}
.tbl .g{color:var(--ok);font-weight:700}
.tbl .y{color:var(--fail);font-weight:700}
.tbl .b{color:var(--free);font-weight:700}
.tblscroll{overflow-x:auto}
.tr-today{background:var(--surface-2)}

/* ---------- settings ---------- */
.srow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:none}
.srow span{flex:1;font-size:14.5px}
.drag{color:var(--muted);font-size:15px;padding:4px}
.btn{display:block;width:100%;padding:13px;border-radius:14px;background:var(--accent);color:var(--bg);font-weight:700;font-size:15px;text-align:center;margin-top:10px}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.switch{width:48px;height:28px;border-radius:999px;background:var(--empty);position:relative;transition:background .18s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-checked=true]{background:var(--ok)}
.switch[aria-checked=true]::after{transform:translateX(20px)}

/* ---------- bottom nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.navin button{padding:9px 0 10px;display:grid;justify-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted)}
.navin button b{font-size:20px;line-height:1;font-weight:400}
.navin button[aria-current=true]{color:var(--ink)}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  animation:up .2s cubic-bezier(.2,.8,.3,1);max-height:88vh;overflow:auto}
@keyframes up{from{transform:translateY(22px)}to{transform:translateY(0)}}
.sheet h3{font-size:17px;margin-bottom:3px}
.sheet p.sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:13px;border-radius:15px;border:1px solid var(--line);margin-bottom:9px;text-align:left;background:var(--surface-2)}
.opt i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-style:normal;font-size:17px;font-weight:700;flex:none}
.opt b{display:block;font-size:15px;font-weight:650}
.opt small{color:var(--muted);font-size:12.5px}
.opt.sel{outline:2px solid var(--accent);outline-offset:-1px}
.i-green{background:var(--ok);color:#fff} .i-yellow{background:var(--fail);color:#0b0b0b}
.i-blue{background:var(--free);color:#fff} .i-none{background:var(--empty);color:var(--muted)}
.sheet .row2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px}
.danger{color:#d03b3b}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand">
      <h1><small>31 días para</small>Mi Prime</h1>
      <button class="iconbtn" id="themeBtn" title="Cambiar tema" aria-label="Cambiar tema">◐</button>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav>
  <div class="navin">
    <button data-tab="hoy"    aria-current="true"><b>◎</b>Hoy</button>
    <button data-tab="mes"    aria-current="false"><b>◍</b>Mes</button>
    <button data-tab="semana" aria-current="false"><b>◔</b>Semanas</button>
    <button data-tab="mas"    aria-current="false"><b>≡</b>Más</button>
  </div>
</nav>

<div id="modal"></div>

<script>
"use strict";

/* =========================================================================
   1. ESTADO Y PERSISTENCIA
   ========================================================================= */
const KEY = "miPrime.v1";
const ST = { GREEN:"green", YELLOW:"yellow", BLUE:"blue" };
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS = ["dom","lun","mar","mié","jue","vie","sáb"];

let memoryOnly = false;
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return migrate(JSON.parse(raw));
  }catch(e){ memoryOnly = true; }
  return seed();
}
function save(){
  if(memoryOnly) return;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ memoryOnly = true; }
}
function migrate(s){
  s.habits ||= []; s.marks ||= {}; s.notes ||= {};
  s.doLess ||= []; s.doMore ||= []; s.settings ||= {};
  s.autoClosed ||= {}; s.values ||= {};   // v2: quién escribió la marca y el valor real
  s.settings.texture ??= false;
  s.habits.forEach((h,i)=>{ h.id ||= uid(); h.order ??= i; });
  return s;
}
function uid(){ return "h" + Math.random().toString(36).slice(2,9); }

function seed(){
  const names = ["Levantarme 06:30","Meditar","Ejercicio","Leer","Elegir bien con el azúcar","Dormir 7 hs","Automatizar"];
  return {
    version: 1,
    createdAt: iso(new Date()),
    habits: names.map((n,i)=>({ id:uid(), name:n, order:i })),
    marks: {},
    autoClosed: {},
    values: {},
    notes: {},
    doLess: ["Usar el celu","Enojarme","Gastar sin pensar","Pensar en el tiempo"],
    doMore: ["Preguntar si no entiendo algo","Mejoras en la casa","Salir a caminar"],
    settings: { lastClosed:null, texture:false, theme:"auto" }
  };
}

/* ---- fechas ---- */
function iso(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function parseISO(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function addDays(d,n){ const x = new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }
function isWeekend(dateStr){ const w = parseISO(dateStr).getDay(); return w===0 || w===6; }
function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }

const TODAY = iso(new Date());

/* ---- lectura/escritura de marcas ---- */
function getMark(date, hid){ return (S.marks[date] || {})[hid] || null; }
function setMark(date, hid, st){
  if(!S.marks[date]) S.marks[date] = {};
  if(st === null) delete S.marks[date][hid];
  else S.marks[date][hid] = st;
  if(Object.keys(S.marks[date]).length === 0) delete S.marks[date];
  save();
}

/* =========================================================================
   2. REGLAS DEL SISTEMA
   ========================================================================= */

/* Cierre automático del día:
   al abrir la app, todo día ya pasado que quedó sin marcar se resuelve solo.
   Fin de semana -> azul (no era obligatorio). Día de semana -> amarillo. */
function autoCloseDays(){
  const yesterday = addDays(new Date(), -1);
  const start = S.settings.lastClosed ? addDays(parseISO(S.settings.lastClosed), 1) : parseISO(S.createdAt);
  if(start > yesterday){ return 0; }
  let filled = 0;
  for(let d = start; d <= yesterday; d = addDays(d,1)){
    const ds = iso(d), free = isWeekend(ds);
    for(const h of S.habits){
      if(!getMark(ds, h.id)){
        setMark(ds, h.id, free ? ST.BLUE : ST.YELLOW);
        markAutoClosed(S, ds, h.id);       // enganche 2: la marca es del robot
        filled++;
      }
    }
  }
  S.settings.lastClosed = iso(yesterday);
  save();
  return filled;
}

/* Racha: verdes seguidos. El azul no suma pero tampoco corta. El amarillo corta. */
function streak(hid){
  let n = 0;
  for(let i = 0; i < 400; i++){
    const ds = iso(addDays(new Date(), -i));
    const m = getMark(ds, hid);
    if(m === ST.GREEN) n++;
    else if(m === ST.BLUE) continue;
    else if(m === ST.YELLOW) break;
    else if(i === 0) continue;   // hoy sin marcar todavía: no corta
    else break;
  }
  return n;
}

/* Regla dura: no se pueden tener 2 amarillos seguidos.
   Devuelve true si el día anterior (sin contar azules) ya fue amarillo. */
function prevIsYellow(date, hid){
  for(let i = 1; i <= 7; i++){
    const m = getMark(iso(addDays(parseISO(date), -i)), hid);
    if(m === ST.BLUE) continue;
    return m === ST.YELLOW;
  }
  return false;
}
/* Hábitos que hoy no pueden fallar */
function atRisk(){ return S.habits.filter(h => prevIsYellow(TODAY, h.id) && getMark(TODAY,h.id) !== ST.GREEN); }
/* Amarillos dobles ya registrados en el mes */
function brokenRules(y,m){
  let n = 0;
  for(let d = 1; d <= daysInMonth(y,m); d++){
    const ds = iso(new Date(y,m,d));
    for(const h of S.habits) if(getMark(ds,h.id) === ST.YELLOW && prevIsYellow(ds,h.id)) n++;
  }
  return n;
}

/* Conteos */
function countRange(y, m, from, to, hid){
  const out = { green:0, yellow:0, blue:0, empty:0 };
  const dim = daysInMonth(y,m);
  for(let d = from; d <= Math.min(to, dim); d++){
    const ds = iso(new Date(y,m,d));
    const list = hid ? [hid] : S.habits.map(h=>h.id);
    for(const id of list){
      const mk = getMark(ds, id);
      if(mk === ST.GREEN) out.green++;
      else if(mk === ST.YELLOW) out.yellow++;
      else if(mk === ST.BLUE) out.blue++;
      else out.empty++;
    }
  }
  return out;
}

/* =========================================================================
   2.5. MÓDULO v2 — origen de las marcas, reglas rotas, metas, import
   -------------------------------------------------------------------------
   Viene de mi-prime-v2.js. Dos adaptaciones para convivir con el código que
   ya estaba, sin cambiar ninguna lógica:
     · no se redeclara ST (ya existe arriba, con los mismos valores)
     · migrate() del módulo se llama acá migrateV2(), porque migrate() ya
       existe y normaliza el estado v1 en cada load()
   Prime % no se toca: sigue siendo verdes/(verdes+amarillos).
   ========================================================================= */
const ORIGIN = { MANUAL:"manual", AUTO:"auto", NONE:"none" };

const METAS_INICIALES = {
  "Caminar seguido":   { unidad:"min",    piso:10, meta:20, sube:5, tope:45, fuente:"exercise_time" },
  "Inglés":            { unidad:"min",    piso:15, meta:30, sube:5, tope:60 },
  "Leer":              { unidad:"min",    piso:10, meta:20, sube:5, tope:45 },
  "Ejercicio":         { unidad:"series", piso:9,  meta:15, sube:3, tope:21 },
  "Moverme cada hora": { unidad:"horas",  piso:6,  meta:8,  sube:1, tope:12, fuente:"move_hourly" }
};

function migrateV2(S, hoy){
  if(S.version >= 2) return S;

  S.autoClosed = S.autoClosed || {};   // { "2026-08-14": ["h7s5ohcv"] }
  S.values     = S.values     || {};   // { "2026-08-14": { "hat3pk68": 32 } }

  // "Caminar 6000 pasos" se parte en dos hábitos distintos
  const caminar = S.habits.find(h => /6000\s*pasos/i.test(h.name));
  if(caminar){
    caminar.name = "Caminar seguido";
    caminar.auto = { source:"steps", threshold:6000, near:0.90 };
    S.habits.push({
      id: "h" + Math.random().toString(36).slice(2, 9),
      name: "Moverme cada hora",
      order: S.habits.length
    });
  }

  for(const h of S.habits){
    const cfg = METAS_INICIALES[h.name];
    if(cfg) h.goal = Object.assign({}, cfg, { desde: hoy });
  }

  S.version = 2;
  return S;
}

/* ---- estadísticas: una sola pasada, todo lo que muestra la pantalla Hoy ----
   Recorre el CALENDARIO, no las claves de marks, para que "dos amarillos
   seguidos" signifique lo mismo acá que en prevIsYellow(): un día sin marcar
   corta la cadena, el azul es transparente. */
function stats(S, desde, hasta){
  const claves = Object.keys(S.marks).sort();
  let victorias = 0, amarillos = 0, reglasRotas = 0, tropiezos = 0;
  let mejorRacha = 0, mejorLimpia = 0;
  const rotasPor = [];
  const ini = desde || claves[0], fin = hasta || claves[claves.length - 1];

  for(const h of (ini && fin ? S.habits : [])){
    let previo = null;      // último estado obligatorio: el azul no cuenta
    let racha = 0, limpia = 0;

    for(let d = parseISO(ini); iso(d) <= fin; d = addDays(d,1)){
      const ds = iso(d);
      const m = S.marks[ds]?.[h.id];
      if(m === ST.BLUE) continue;             // el azul es transparente a todo
      if(!m){ previo = null; continue; }       // sin marca: corta la cadena

      if(m === ST.GREEN){
        victorias++;
        racha++;  limpia++;
        if(racha  > mejorRacha)  mejorRacha  = racha;
        if(limpia > mejorLimpia) mejorLimpia = limpia;
        previo = ST.GREEN;
        continue;
      }

      amarillos++;
      racha = 0;                              // el amarillo siempre corta la racha
      if(previo === ST.YELLOW){
        reglasRotas++;
        limpia = 0;                           // solo la regla rota corta la limpia
        rotasPor.push({ fecha:ds, habito:h.name });
      } else {
        tropiezos++;
        limpia++;
        if(limpia > mejorLimpia) mejorLimpia = limpia;
      }
      previo = ST.YELLOW;
    }
  }

  const base = victorias + amarillos;
  return {
    victorias,
    reglasRotas,
    tropiezos,
    amarillos,
    prime: base ? Math.round(1000 * victorias / base) / 10 : 0,
    mejorRacha,
    mejorRachaLimpia: mejorLimpia,
    rotasPor
  };
}

/* ---- metas y progresión automática ----
   Sube tras 21 días cumpliendo la meta el 80% de las veces.
   Baja tras 21 días cumpliendo el piso menos de la mitad de las veces. */
const VENTANA = 21, PARA_SUBIR = 0.80, PARA_BAJAR = 0.50;

function diasEntre(a, b){
  return Math.round((parseISO(b) - parseISO(a)) / 86400000);
}

function evaluarProgresion(S, hoy){
  const avisos = [];

  for(const h of S.habits){
    const g = h.goal;
    if(!g || !g.desde) continue;
    if(diasEntre(g.desde, hoy) < VENTANA) continue;

    let obligatorios = 0, llegoMeta = 0, llegoPiso = 0;
    for(const d of Object.keys(S.marks)){
      if(d < g.desde || d >= hoy) continue;
      const m = S.marks[d][h.id];
      if(!m || m === ST.BLUE) continue;
      obligatorios++;
      const v = S.values?.[d]?.[h.id];
      const valor = (v != null) ? v : (m === ST.GREEN ? g.meta : 0);
      if(valor >= g.meta) llegoMeta++;
      if(valor >= g.piso) llegoPiso++;
    }

    if(obligatorios < 10){ continue; }      // muestra muy chica, no se decide nada

    const antes = g.meta;
    if(llegoMeta / obligatorios >= PARA_SUBIR && g.meta < g.tope){
      g.meta = Math.min(g.meta + g.sube, g.tope);
      g.piso = Math.round(g.meta * 0.6);
      avisos.push({ habito:h.name, tipo:"sube", de:antes, a:g.meta, unidad:g.unidad });
    } else if(llegoPiso / obligatorios < PARA_BAJAR){
      g.meta = Math.max(g.meta - g.sube, g.sube);
      g.piso = Math.round(g.meta * 0.6);
      avisos.push({ habito:h.name, tipo:"baja", de:antes, a:g.meta, unidad:g.unidad });
    }
    g.desde = hoy;                          // la ventana siempre se reinicia
  }

  if(avisos.length) save();
  return avisos;
}

/* Un toque = cumplí la meta. Toque largo = poner el valor real. */
function setValor(S, date, hid, valor){
  const h = S.habits.find(x => x.id === hid);
  if(!h?.goal) return;
  if(!S.values) S.values = {};
  if(!S.values[date]) S.values[date] = {};
  S.values[date][hid] = valor;
  setMark(date, hid, valor >= h.goal.piso ? ST.GREEN : ST.YELLOW);
  if(Object.keys(S.values[date]).length === 0) delete S.values[date];
  save();
}

/* ---- origen de las marcas: manual > import > cierre automático ---- */
function originOf(S, date, hid){
  const m = S.marks?.[date]?.[hid];
  if(!m) return ORIGIN.NONE;
  return (S.autoClosed?.[date] || []).includes(hid) ? ORIGIN.AUTO : ORIGIN.MANUAL;
}
function markAutoClosed(S, date, hid){
  if(!S.autoClosed) S.autoClosed = {};
  (S.autoClosed[date] = S.autoClosed[date] || []).push(hid);
}
function markManual(S, date, hid){
  const a = S.autoClosed?.[date];
  if(!a) return;
  const i = a.indexOf(hid);
  if(i >= 0) a.splice(i, 1);
  if(a.length === 0) delete S.autoClosed[date];
}

/* ---- import desde Samsung Health ----
   Trampas del archivo: línea 1 es metadata, BOM, coma sobrante al final de
   cada fila, varias filas por día, y day_time se corta como TEXTO — nunca
   new Date(), que reintroduce el bug de UTC. */
function parseSamsungSteps(text){
  const lines = text.replace(/^\uFEFF/, "").split(/\r?\n/);
  if(lines.length < 3) throw new Error("El archivo no tiene filas de datos.");
  const head = lines[1].split(",");
  const iDay = head.indexOf("day_time"), iCount = head.indexOf("count");
  if(iDay < 0 || iCount < 0)
    throw new Error("No parece el export de pasos. Buscá el archivo que termina en step_daily_trend.");
  const byDay = {};
  for(let i = 2; i < lines.length; i++){
    const f = lines[i].split(",");
    if(f.length < head.length) continue;
    const date = (f[iDay] || "").slice(0, 10);
    const n = parseInt(f[iCount], 10);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || !Number.isFinite(n)) continue;
    byDay[date] = Math.max(byDay[date] || 0, n);
  }
  if(!Object.keys(byDay).length) throw new Error("No se encontró ningún día con pasos.");
  return byDay;
}

function planStepImport(S, stepsByDay, today){
  const targets = S.habits.filter(h => h.auto?.source === "steps");
  const plan = [];
  if(!targets.length) return plan;
  const dates = Object.keys(stepsByDay).sort();

  for(const h of targets){
    const { threshold, near } = h.auto;
    const floor = Math.round(threshold * (near ?? 0.9));
    for(const date of dates){
      if(date >= today) continue;                       // el día en curso no se toca
      if(S.createdAt && date < S.createdAt) continue;
      const steps = stepsByDay[date];
      const from = S.marks?.[date]?.[h.id] || null;
      const origin = originOf(S, date, h.id);

      let to, why, ask = false;
      if(steps >= threshold){ to = ST.GREEN; why = `${steps.toLocaleString("es-AR")} pasos`; }
      else if(steps >= floor){ to = ST.GREEN; ask = true;
        why = `${steps.toLocaleString("es-AR")} pasos — faltaron ${threshold - steps}`; }
      else { to = ST.YELLOW; why = `${steps.toLocaleString("es-AR")} pasos`; }

      if(to === from) continue;                         // idempotencia

      if(origin === ORIGIN.MANUAL){
        plan.push({ date, hid:h.id, from, to, steps, why, action:"informar", ask:false,
                    note:"Lo marcaste vos. No se cambia." });
        continue;
      }
      if(to === ST.YELLOW && prevIsYellow(date, h.id)){
        ask = true; why += " — sería el segundo amarillo seguido";
      }
      plan.push({ date, hid:h.id, from, to, steps, why, action:"proponer", ask,
                  note: origin === ORIGIN.AUTO ? "Lo había cerrado la app sola." : "Estaba sin marcar." });
    }
  }
  return plan.sort((a,b) => a.date < b.date ? -1 : 1);
}

function applyStepImport(S, plan, accepted){
  let n = 0;
  for(const p of plan){
    if(p.action !== "proponer") continue;
    if(!accepted.has(p.date + "|" + p.hid)) continue;
    setMark(p.date, p.hid, p.to);
    markManual(S, p.date, p.hid);      // deja de ser del robot
    n++;
  }
  save();
  return n;
}

/* =========================================================================
   4. GEOMETRÍA DE LAS RUEDAS
   ========================================================================= */
function polar(cx, cy, r, deg){ const a = (deg - 90) * Math.PI / 180; return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; }
function sector(cx, cy, r0, r1, a0, a1){
  const [x0,y0] = polar(cx,cy,r1,a0), [x1,y1] = polar(cx,cy,r1,a1);
  const [x2,y2] = polar(cx,cy,r0,a1), [x3,y3] = polar(cx,cy,r0,a0);
  const big = (a1 - a0) > 180 ? 1 : 0;
  return `M${x0.toFixed(2)},${y0.toFixed(2)} A${r1},${r1} 0 ${big} 1 ${x1.toFixed(2)},${y1.toFixed(2)}`
       + ` L${x2.toFixed(2)},${y2.toFixed(2)} A${r0},${r0} 0 ${big} 0 ${x3.toFixed(2)},${y3.toFixed(2)} Z`;
}
function fillOf(st){
  return st === ST.GREEN ? "var(--ok)" : st === ST.YELLOW ? "var(--fail)" : st === ST.BLUE ? "var(--free)" : "var(--empty)";
}
function texOf(st){
  if(!S.settings.texture) return null;
  return st === ST.YELLOW ? "url(#txY)" : st === ST.BLUE ? "url(#txB)" : null;
}
const DEFS = `<defs>
  <pattern id="txY" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="6" height="6" fill="var(--fail)"/><rect width="2.2" height="6" fill="rgba(0,0,0,.42)"/></pattern>
  <pattern id="txB" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
    <rect width="6" height="6" fill="var(--free)"/><rect width="2.2" height="6" fill="rgba(255,255,255,.5)"/></pattern>
</defs>`;

/* Rueda del mes: 1 anillo por hábito, 1 sector por día */
function monthWheel(y, m){
  const dim = daysInMonth(y,m), hs = habitsSorted();
  const SZ = 340, C = SZ/2, R = 152, HOLE = 46;
  const band = hs.length ? (R - HOLE) / hs.length : 0;
  const step = 360 / dim, gap = Math.min(1.6, step * .18);
  const now = new Date();
  const todayD = (y === now.getFullYear() && m === now.getMonth()) ? now.getDate() : 0;
  let cells = "", labs = "";
  for(let d = 1; d <= dim; d++){
    const ds = iso(new Date(y,m,d));
    const a0 = (d-1)*step + gap/2, a1 = d*step - gap/2;
    hs.forEach((h, i) => {
      const r0 = HOLE + i*band + .9, r1 = HOLE + (i+1)*band - .9;
      const st = getMark(ds, h.id);
      const tx = texOf(st);
      cells += `<path class="cell" d="${sector(C,C,r0,r1,a0,a1)}" fill="${tx||fillOf(st)}" `
            + `stroke="var(--surface)" stroke-width="0.6" data-d="${ds}" data-h="${h.id}">`
            + `<title>${d} · ${h.name} · ${stName(st)}</title></path>`;
    });
    if(d % 2 === 1 || dim <= 28 || d === todayD){
      const [lx,ly] = polar(C,C,R+11,(d-.5)*step);
      const isT = d === todayD;
      labs += `<text class="daylab" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle"`
           + (isT ? ` style="fill:var(--ink);font-weight:800"` : ``) + `>${d}</text>`;
    }
  }
  let tmark = "";
  if(todayD){
    tmark = `<path d="${sector(C,C,HOLE-3.5,R+3.5,(todayD-1)*step,todayD*step)}" fill="none"
      stroke="var(--ink)" stroke-width="1.7" stroke-linejoin="round" opacity=".9"/>`;
  }
  const c = countRange(y,m,1,dim,null);
  const oblig = c.green + c.yellow;
  const pct = oblig ? Math.round(c.green / oblig * 100) : 0;
  return `<svg viewBox="-14 -14 ${SZ+28} ${SZ+28}" role="img" aria-label="Rueda del mes">${DEFS}${cells}${tmark}${labs}
    <text class="ctr" x="${C}" y="${C-4}" text-anchor="middle" style="font-size:26px">${pct}%</text>
    <text class="ctr-s" x="${C}" y="${C+13}" text-anchor="middle">PRIME</text></svg>`;
}

/* Rueda de una semana: 1 sector por día del bloque */
function weekWheel(y, m, from, to, hid, label){
  const n = to - from + 1;
  if(n <= 0) return "";
  const SZ = 132, C = SZ/2, R = 56, HOLE = 27;
  const step = 360 / n, gap = 3.2;
  let cells = "";
  for(let k = 0; k < n; k++){
    const d = from + k, ds = iso(new Date(y,m,d));
    const st = getMark(ds, hid), tx = texOf(st);
    cells += `<path class="cell" d="${sector(C,C,HOLE,R,k*step+gap/2,(k+1)*step-gap/2)}" fill="${tx||fillOf(st)}" `
          + `stroke="var(--surface-2)" stroke-width="1" data-d="${ds}" data-h="${hid}">`
          + `<title>${d} · ${stName(st)}</title></path>`;
  }
  const c = countRange(y,m,from,to,hid);
  return `<div class="wk"><h4>${label}</h4>
    <svg viewBox="-4 -4 ${SZ+8} ${SZ+8}">${DEFS}${cells}
      <text class="ctr" x="${C}" y="${C+1}" text-anchor="middle" style="font-size:12px">${from}-${to}</text></svg>
    <div class="vd"><span class="v">VIC ${c.green}</span><span class="d">DER ${c.yellow}</span></div></div>`;
}

function habitsSorted(){ return [...S.habits].sort((a,b)=>(a.order??0)-(b.order??0)); }
function stName(st){ return st===ST.GREEN?"Hecho":st===ST.YELLOW?"No se hizo":st===ST.BLUE?"Libre":"Sin marcar"; }
function stGlyph(st){ return st===ST.GREEN?"✓":st===ST.YELLOW?"✕":st===ST.BLUE?"–":"·"; }

  const blocks = [[1,7,"1era Semana"],[8,14,"2da Semana"],[15,21,"3era Semana"],[22,28,"4ta Semana"]];
  if(dim > 28) blocks.push([29, dim, `Últimos ${dim-28} días`]);
  const wheels = blocks.map(b => weekWheel(y, m, b[0], Math.min(b[1],dim), weekHabit, b[2])).join("");
  const t = countRange(y,m,1,dim,weekHabit);
  return `${monthNav()}
  <div class="chips">${hs.map(x=>`<button class="chip" data-act="wh" data-h="${x.id}" aria-pressed="${x.id===weekHabit}">${esc(x.name)}</button>`).join("")}</div>
  <div class="card">
    <div class="card-t">Planificación semanal · ${esc(h.name)}</div>
    <div class="weeks">${wheels}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">
      <b style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">Total</b>
      <div class="vd" style="margin:0"><span class="v">VIC ${t.green}</span><span class="d">DER ${t.yellow}</span></div>
    </div>
  </div>
  <div class="card"><p style="margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.5">
    “No se trata de hacer mucho una vez, sino de hacer poco todos los días.”<br>
    <span style="color:var(--muted);font-size:12.5px">— Brian Tracy</span></p></div>`;
}

/* ---------- MÁS ---------- */
function vMas(){
  const {y,m} = cursor, dim = daysInMonth(y,m), hs = habitsSorted();
  const habitRows = hs.map((h,i)=>`<div class="srow">
    <span class="drag" data-act="up" data-h="${h.id}" ${i===0?'style="opacity:.25"':""}>▲</span>
    <span>${esc(h.name)}</span>
    <button class="x" data-act="renameH" data-h="${h.id}" style="color:var(--muted);font-size:15px">✎</button>
    <button class="x" data-act="delH" data-h="${h.id}" style="color:var(--muted);font-size:17px">×</button></div>`).join("");

  const listRows = (arr, kind, color) => arr.map((t,i)=>`<div class="li">
      <span class="bar" style="background:${color}"></span><span>${esc(t)}</span>
      <button class="x" data-act="delL" data-k="${kind}" data-i="${i}">×</button></div>`).join("")
      || `<p style="color:var(--muted);font-size:13.5px;margin:4px 0">Vacío por ahora.</p>`;

  let rows = "";
  for(let d = 1; d <= dim; d++){
    const ds = iso(new Date(y,m,d));
    rows += `<tr class="${ds===TODAY?"tr-today":""}"><td>${d} ${DIAS[parseISO(ds).getDay()]}</td>` +
      hs.map(h=>{ const st = getMark(ds,h.id);
        return `<td class="${st===ST.GREEN?"g":st===ST.YELLOW?"y":st===ST.BLUE?"b":""}">${stGlyph(st)}</td>`; }).join("") + `</tr>`;
  }

  return `
  <div class="card"><div class="card-t">Mis hábitos</div>${habitRows}
    <div class="addrow"><input type="text" id="newHabit" placeholder="Nuevo hábito" maxlength="42"><button data-act="addH">Agregar</button></div>
  </div>
  <div class="card"><div class="card-t">Hacer menos</div>${listRows(S.doLess,"less","#d03b3b")}
    <div class="addrow"><input type="text" id="newLess" placeholder="Algo que quiero soltar" maxlength="42"><button data-act="addL" data-k="less">+</button></div>
  </div>
  <div class="card"><div class="card-t">Hacer más</div>${listRows(S.doMore,"more","var(--ok)")}
    <div class="addrow"><input type="text" id="newMore" placeholder="Algo que quiero sumar" maxlength="42"><button data-act="addL" data-k="more">+</button></div>
  </div>
  <div class="card"><div class="card-t">Historial · ${MESES[m]} ${y}</div>
    <div class="tblscroll"><table class="tbl"><thead><tr><th>Día</th>${hs.map((h,i)=>`<th title="${esc(h.name)}">${i+1}</th>`).join("")}</tr></thead>
    <tbody>${rows}</tbody></table></div>
    <p style="font-size:12px;color:var(--muted);margin:8px 0 0">✓ hecho · ✕ no se hizo · – libre · · sin marcar</p>
  </div>
  <div class="card"><div class="card-t">Ajustes</div>
    <div class="srow"><span>Texturas (daltonismo / impresión)</span>
      <button class="switch" data-act="tex" role="switch" aria-checked="${!!S.settings.texture}"></button></div>
    <div class="srow"><span>Guardado</span><b style="font-size:13px;color:${memoryOnly?"var(--fail)":"var(--ok)"}">${memoryOnly?"solo en memoria":"en este dispositivo"}</b></div>
    <button class="btn" data-act="export">Exportar respaldo (.json)</button>
    <button class="btn ghost" data-act="import">Importar respaldo</button>
    <button class="btn ghost" data-act="importPasos">Importar pasos (Samsung Health)</button>
    <button class="btn ghost danger" data-act="reset">Borrar todo</button>
    <p style="font-size:12px;color:var(--muted);margin:12px 0 0;line-height:1.5">
      El respaldo se descarga como archivo: guardalo en Google Drive desde el menú de compartir del celular.
      Agregá esta página a la pantalla de inicio para abrirla como una app.</p>
  </div>`;
}

function monthNav(){
  return `<div class="mnav">
    <button data-act="prevM" aria-label="Mes anterior">‹</button>
    <b>${MESES[cursor.m]} ${cursor.y}</b>
    <button data-act="nextM" aria-label="Mes siguiente">›</button></div>`;
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* =========================================================================
   6. INTERACCIÓN
   ========================================================================= */
function bind(){
  view.querySelectorAll("[data-act]").forEach(el => el.addEventListener("click", onAct));
  view.querySelectorAll(".cell").forEach(el => el.addEventListener("click", () => openPicker(el.dataset.d, el.dataset.h)));
  bindLongPress();
  const n = document.getElementById("note");
  if(n) n.addEventListener("input", e => { S.notes[TODAY] = e.target.value; save(); });
  ["newHabit","newLess","newMore"].forEach(id => {
    const i = document.getElementById(id);
    if(i) i.addEventListener("keydown", e => {
      if(e.key === "Enter"){
        if(id === "newHabit") addHabit();
        else addListItem(id === "newLess" ? "less" : "more");
      }
    });
  });
}

/* Enganche 5: toque largo sobre un hábito con meta -> cargar el valor real.
   Un toque normal sigue siendo "cumplí la meta" y no pide ningún número. */
let longPressFired = false;
function bindLongPress(){
  view.querySelectorAll('.dot[data-goal="1"]').forEach(el => {
    let timer = null;
    const start = () => {
      clearTimeout(timer);
      timer = setTimeout(() => { longPressFired = true; valorSheet(TODAY, el.dataset.h); }, 500);
    };
    const cancel = () => clearTimeout(timer);
    el.addEventListener("pointerdown", start);
    el.addEventListener("pointerup", cancel);
    el.addEventListener("pointerleave", cancel);
    el.addEventListener("pointercancel", cancel);
    el.addEventListener("contextmenu", e => e.preventDefault());
  });
}

function valorSheet(date, hid){
  const h = S.habits.find(x => x.id === hid);
  if(!h?.goal) return;
  const g = h.goal, actual = S.values?.[date]?.[hid];
  sheet(`<h3>${esc(h.name)}</h3>
    <p class="sub">Meta ${g.meta} ${esc(g.unidad)} · piso ${g.piso} ${esc(g.unidad)}. Abajo del piso queda amarillo.</p>
    <input type="number" id="pv" inputmode="numeric" min="0" step="1" value="${actual != null ? actual : g.meta}">
    <div class="row2"><button class="btn ghost" data-x="c" style="margin:0">Cancelar</button>
    <button class="btn" data-x="o" style="margin:0">Guardar</button></div>`);
  const inp = modal.querySelector("#pv");
  inp.focus(); inp.select();
  modal.querySelector('[data-x="c"]').onclick = closeSheet;
  const ok = () => {
    const v = parseInt(inp.value, 10);
    closeSheet();
    if(Number.isFinite(v) && v >= 0){ setValor(S, date, hid, v); render(); }
  };
  modal.querySelector('[data-x="o"]').onclick = ok;
  inp.addEventListener("keydown", e => { if(e.key === "Enter") ok(); });
}

function onAct(e){
  const el = e.currentTarget, a = el.dataset.act, hid = el.dataset.h;
  switch(a){
    case "quick": {
      if(longPressFired){ longPressFired = false; break; }   // fue toque largo, no toque
      const st = getMark(TODAY, hid);
      if(st === ST.GREEN) applyMark(TODAY, hid, null);
      else applyMark(TODAY, hid, ST.GREEN);
      break;
    }
    case "pick": openPicker(TODAY, hid); break;
    case "wh": weekHabit = hid; render(); break;
    case "prevM": cursor.m--; if(cursor.m < 0){ cursor.m = 11; cursor.y--; } render(); break;
    case "nextM": cursor.m++; if(cursor.m > 11){ cursor.m = 0; cursor.y++; } render(); break;
    case "addH": addHabit(); break;
    case "delH": confirmSheet("¿Borrar hábito?", "Se borra también su historial de marcas.", "Borrar", () => {
        S.habits = S.habits.filter(h => h.id !== hid);
        for(const d in S.marks) delete S.marks[d][hid];
        save(); render();
      }); break;
    case "renameH": renameHabit(hid); break;
    case "up": {
      const hs = habitsSorted(), i = hs.findIndex(h => h.id === hid);
      if(i > 0){ const a1 = hs[i].order ?? i, b1 = hs[i-1].order ?? (i-1); hs[i].order = b1; hs[i-1].order = a1; save(); render(); }
      break;
    }
    case "addL": addListItem(el.dataset.k); break;
    case "delL": { (el.dataset.k === "less" ? S.doLess : S.doMore).splice(+el.dataset.i, 1); save(); render(); break; }
    case "tex": S.settings.texture = !S.settings.texture; save(); render(); break;
    case "export": doExport(); break;
    case "import": doImport(); break;
    case "importPasos": doImportPasos(); break;
    case "reset": confirmSheet("¿Borrar todo?", "Se pierden hábitos, marcas y notas. No se puede deshacer.", "Borrar todo", () => {
        S = seed(); save(); cursor = { y:new Date().getFullYear(), m:new Date().getMonth() }; TAB = "hoy"; render();
      }); break;
  }
}

/* Aplica una marca respetando la regla de los 2 amarillos.
   Enganche 3: si la tocaste vos, la marca pasa a ser tuya y deja de ser
   del cierre automático. Vale para Hoy y para las celdas de la rueda. */
function applyMark(date, hid, st, skipCheck){
  if(st === ST.YELLOW && !skipCheck && prevIsYellow(date, hid)){
    const h = S.habits.find(x => x.id === hid);
    confirmSheet("⚠ Estás por romper la regla",
      `Este sería el 2º amarillo seguido en “${h.name}”. La regla del sistema es que nunca haya dos días fallados seguidos.`,
      "Marcar igual", () => { setMark(date, hid, st); markManual(S, date, hid); save(); render(); });
    return;
  }
  setMark(date, hid, st);
  markManual(S, date, hid);
  save();
  render();
}

/* ---------- sheets ---------- */
const modal = document.getElementById("modal");
function closeSheet(){ modal.innerHTML = ""; }
function sheet(html){
  modal.innerHTML = `<div class="scrim"><div class="sheet">${html}</div></div>`;
  modal.querySelector(".scrim").addEventListener("click", e => { if(e.target === e.currentTarget) closeSheet(); });
}
function openPicker(date, hid){
  const h = S.habits.find(x => x.id === hid); if(!h) return;
  const cur = getMark(date, hid), d = parseISO(date);
  const opt = (st, cls, gl, t, sub) => `<button class="opt ${cur===st?"sel":""}" data-st="${st||""}">
    <i class="${cls}">${gl}</i><span><b>${t}</b><small>${sub}</small></span></button>`;
  sheet(`<h3>${esc(h.name)}</h3><p class="sub">${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}</p>
    ${opt(ST.GREEN,"i-green","✓","Verde","Lo hice")}
    ${opt(ST.YELLOW,"i-yellow","✕","Amarillo","No lo hice")}
    ${opt(ST.BLUE,"i-blue","–","Azul","Libre, no era obligatorio")}
    ${opt("","i-none","·","Sin marcar","Dejarlo en blanco")}`);
  modal.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const st = b.dataset.st || null; closeSheet(); applyMark(date, hid, st);
  });
}
function confirmSheet(title, sub, okText, fn){
  sheet(`<h3>${esc(title)}</h3><p class="sub">${esc(sub)}</p>
    <div class="row2"><button class="btn ghost" data-x="c" style="margin:0">Cancelar</button>
    <button class="btn" data-x="o" style="margin:0">${esc(okText)}</button></div>`);
  modal.querySelector('[data-x="c"]').onclick = closeSheet;
  modal.querySelector('[data-x="o"]').onclick = () => { closeSheet(); fn(); };
}
function promptSheet(title, val, fn){
  sheet(`<h3>${esc(title)}</h3><input type="text" id="pv" maxlength="42" value="${esc(val)}">
    <div class="row2"><button class="btn ghost" data-x="c" style="margin:0">Cancelar</button>
    <button class="btn" data-x="o" style="margin:0">Guardar</button></div>`);
  const inp = modal.querySelector("#pv"); inp.focus(); inp.select();
  modal.querySelector('[data-x="c"]').onclick = closeSheet;
  const ok = () => { const v = inp.value.trim(); closeSheet(); if(v) fn(v); };
  modal.querySelector('[data-x="o"]').onclick = ok;
  inp.addEventListener("keydown", e => { if(e.key === "Enter") ok(); });
}
function toast(msg){
  const t = document.createElement("div");
  t.textContent = msg;
  t.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:60;background:var(--ink);color:var(--bg);"
    + "padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:var(--shadow)";
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1900);
}

/* ---------- CRUD ---------- */
function addHabit(){
  const i = document.getElementById("newHabit"); if(!i) return;
  const v = i.value.trim(); if(!v) return;
  S.habits.push({ id: uid(), name: v, order: S.habits.length });
  save(); render();
}
function renameHabit(hid){
  const h = S.habits.find(x => x.id === hid); if(!h) return;
  promptSheet("Renombrar hábito", h.name, v => { h.name = v; save(); render(); });
}
function addListItem(kind){
  const i = document.getElementById(kind === "less" ? "newLess" : "newMore"); if(!i) return;
  const v = i.value.trim(); if(!v) return;
  (kind === "less" ? S.doLess : S.doMore).push(v);
  save(); render();
}

/* ---------- backup ---------- */
function doExport(){
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `mi-prime-${TODAY}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("Respaldo descargado");
}
function doImport(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const f = inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const data = migrate(JSON.parse(r.result));
        if(!Array.isArray(data.habits)) throw new Error("formato");
        migrateV2(data, TODAY);
        S = data; save(); autoCloseDays(); applyTheme(); render(); toast("Respaldo importado");
      }catch(e){ toast("Archivo inválido"); }
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ---------- import de pasos (enganche 6) ----------
   El CSV nunca sale del teléfono: se lee en memoria y se descarta. */
function doImportPasos(){
  if(!S.habits.some(h => h.auto?.source === "steps")){
    toast("Ningún hábito está conectado a los pasos");
    return;
  }
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".csv,text/csv";
  inp.onchange = () => {
    const f = inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      let steps;
      try{ steps = parseSamsungSteps(String(r.result)); }
      catch(e){ toast(e.message); return; }
      renderImportUI(planStepImport(S, steps, TODAY));
    };
    r.readAsText(f);
  };
  inp.click();
}

function renderImportUI(plan){
  const prop = plan.filter(p => p.action === "proponer");
  const info = plan.filter(p => p.action === "informar");
  if(!prop.length && !info.length){ toast("Los pasos ya están al día"); return; }

  const nombre = hid => esc(S.habits.find(h => h.id === hid)?.name || "");
  const fila = p => `<label class="li" style="cursor:pointer">
      <input type="checkbox" data-k="${p.date}|${p.hid}" ${p.ask ? "" : "checked"} style="width:auto;flex:none">
      <span class="bar" style="background:${p.to === ST.GREEN ? "var(--ok)" : "var(--fail)"}"></span>
      <span><b>${p.date}</b> · ${nombre(p.hid)}<br>
        <small style="color:var(--muted)">${esc(p.why)} · ${esc(p.note)}</small></span></label>`;

  sheet(`<h3>Importar pasos</h3>
    <p class="sub">${prop.length} ${prop.length===1?"día para cambiar":"días para cambiar"}${info.length?` · ${info.length} que marcaste vos quedan intactos`:""}.
      Los que faltaron pocos pasos vienen destildados.</p>
    ${prop.length ? prop.map(fila).join("") : `<p style="color:var(--muted);font-size:13.5px">No hay nada para cambiar.</p>`}
    ${info.length ? `<p style="font-size:12.5px;color:var(--muted);margin:12px 0 0">
      Sin tocar, porque los marcaste vos: ${info.map(p => esc(p.date)).join(", ")}</p>` : ""}
    <div class="row2"><button class="btn ghost" data-x="c" style="margin:0">Cancelar</button>
    <button class="btn" data-x="o" style="margin:0">Aplicar</button></div>`);

  modal.querySelector('[data-x="c"]').onclick = closeSheet;
  modal.querySelector('[data-x="o"]').onclick = () => {
    const accepted = new Set();
    modal.querySelectorAll('input[type=checkbox]').forEach(c => { if(c.checked) accepted.add(c.dataset.k); });
    closeSheet();
    const n = applyStepImport(S, plan, accepted);
    render();
    toast(n ? `${n} ${n===1?"día actualizado":"días actualizados"}` : "No se cambió nada");
  };
}

/* ---------- nav ---------- */
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { TAB = b.dataset.tab; render(); });

/* ---------- go ---------- */
render();
if(autoFilled > 0){
  setTimeout(() => toast(`Se cerraron ${autoFilled} marcas de días pasados`), 500);
}

/* =========================================================================
   7. PWA: service worker e instalación
   ========================================================================= */
/* Solo sobre http/https. Abierta con doble clic (file://) la app funciona igual,
   simplemente sin caché offline. */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}

/* Botón "Instalar" en Ajustes cuando el navegador lo ofrece */
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
  showInstallBar();
});
window.addEventListener("appinstalled", () => { deferredPrompt = null; hideInstallBar(); });

function isStandalone(){
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
}
function showInstallBar(){
  if(document.getElementById("installBar") || isStandalone()) return;
  const bar = document.createElement("div");
  bar.id = "installBar";
  bar.style.cssText = "position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:45;"
    + "max-width:496px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px;"
    + "display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);font-size:14px";
  bar.innerHTML = `<span style="flex:1;line-height:1.3"><b>Instalá Mi Prime</b><br>
    <span style="opacity:.75;font-size:12.5px">Queda en tu pantalla de inicio y abre sin conexión.</span></span>
    <button id="installGo" style="background:var(--bg);color:var(--ink);border-radius:11px;padding:9px 14px;font-weight:700;font-size:13.5px">Instalar</button>
    <button id="installNo" style="opacity:.6;padding:6px 4px;font-size:18px">×</button>`;
  document.body.appendChild(bar);
  document.getElementById("installGo").onclick = async () => {
    if(!deferredPrompt) return hideInstallBar();
    hideInstallBar();
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
  };
  document.getElementById("installNo").onclick = hideInstallBar;
}
function hideInstallBar(){ document.getElementById("installBar")?.remove(); }

window.__prime = { get S(){ return S; }, set S(v){ S = v; }, render, applyMark, streak, prevIsYellow, autoCloseDays, countRange, iso, ST, save, seed, isStandalone,
  /* v2 */ migrateV2, stats, evaluarProgresion, setValor, originOf, markAutoClosed, markManual, parseSamsungSteps, planStepImport, applyStepImport, ORIGIN };
