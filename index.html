/* Tropiezos sueltos y sin dato no rompen la regla, pero sí bajan el Prime %:
   los dos entran en el denominador. */
function noRompen(tropiezos, sinDato){
  const partes = [];
  if(tropiezos) partes.push(tropiezos + (tropiezos===1 ? " tropiezo suelto" : " tropiezos sueltos"));
  if(sinDato)   partes.push(sinDato + " sin dato (quedaron sin marcar)");
  if(!partes.length) return "";
  const uno = partes.length === 1 && tropiezos + sinDato === 1;
  return `<p style="font-size:12.5px;color:var(--muted);margin:-4px 0 12px;text-align:center">
    ${partes.join(" y ")}: ${uno ? "no rompe la regla, pero baja" : "no rompen la regla, pero bajan"} el Prime %</p>`;
}

/* ---------- HOY ---------- */
function vHoy(){
  const d = new Date(), hs = habitsSorted(), free = esLibre(TODAY);
  const feriado = esFeriado(TODAY);
  const ahora = d.getHours() * 60 + d.getMinutes();
  const c = countRange(d.getFullYear(), d.getMonth(), d.getDate(), d.getDate(), null);
  const risk = atRisk();
  const done = c.green, total = hs.length;
  /* Enganche 4: una sola pasada de stats() sobre el mes en curso, no sobre
     el que haya quedado abierto en Mes */
  const r = statsMes(d.getFullYear(), d.getMonth());

  let alert = "";
  if(risk.length){
    /* El día que falló cada hábito: el lunes suele ser el viernes, no ayer */
    const cuando = h => diaRelativo(prevDay(TODAY, h.id).date);
    const dias = [...new Set(risk.map(cuando))];
    const lista = arr => arr.length > 3 ? arr.slice(0,2).join(", ") + ` y ${arr.length-2} más` : arr.join(", ");
    const detalle = dias.length === 1
      ? `${cap(dias[0])} ${risk.length===1?"quedó":"quedaron"} en amarillo: ${esc(lista(risk.map(h=>h.name)))}.`
      : `Quedaron en amarillo: ${esc(lista(risk.map(h=>`${h.name} (${cuando(h)})`)))}.`;
    alert = `<div class="alert risk"><span class="ic">⚠</span><div><b>Hoy no podés fallar en ${risk.length===1?"1 hábito":risk.length+" hábitos"}.</b><br>
      ${detalle} Dos amarillos seguidos rompen la regla.</div></div>`;
  } else if(done === total && total > 0){
    alert = `<div class="alert good"><span class="ic">✓</span><div><b>Día completo.</b> Los ${total} hábitos en verde. Así se llega al prime.</div></div>`;
  }

  /* Lo del último día hábil que quedó sin marcar: se confirma acá, a la mañana */
  const pend = pendientes(TODAY);
  const pendHTML = !pend ? "" : `<div class="card"><div class="card-t">${cap(diaRelativo(pend.date))} quedó sin marcar</div>
    ${pend.habits.map(h => `<div class="li"><span>${esc(h.name)}${h.hora ? ` <small style="color:var(--muted)">${h.hora}</small>` : ""}</span>

      <button class="pq no" data-act="pend" data-d="${pend.date}" data-h="${h.id}" data-st="${ST.YELLOW}" aria-label="No lo hice: ${esc(h.name)}">✕</button></div>`).join("")}
    <p style="font-size:12.5px;color:var(--muted);margin:8px 0 0">Lo que no confirmes queda gris (sin dato).</p></div>`;

  /* El día en orden de horario: arriba lo que toca primero */
  const rows = porHora(hs).map(h => {
    const st = getMark(TODAY, h.id), k = streak(h.id);
    const danger = risk.includes(h);
    const hora = h.hora ? `<span>${horario(h)}</span>` : "";
    const ya = !free && st !== ST.GREEN && esAhora(h, ahora) ? `<span class="now">ahora</span>` : "";
    /* El hábito de pasos se mide en pasos (se marca solo al llegar); el resto con
       meta acepta toque largo para el valor real (enganche 5) */
    const dePasos = h.auto?.source === "steps", hoyPasos = S.pasos?.[TODAY];
    const g = dePasos ? null : h.goal, val = S.values?.[TODAY]?.[h.id];
    const meta = dePasos ? (free ? "" : `<span>${hoyPasos != null ? fmt(hoyPasos) + "/" : ""}${fmt(metaPasos(S))} pasos</span>`)
      : g ? `<span>${val != null ? val + "/" : ""}${g.meta} ${esc(g.unidad)}</span>`
      : h.auto?.source === "finanzas" ? `<span>${detalleHabitoFin(h.auto.regla)}</span>` : "";
    return `<div class="hrow">
      <button class="dot ${st?("s-"+st):""}" data-act="quick" data-h="${h.id}"${g?' data-goal="1"':""} aria-label="Marcar ${esc(h.name)}">${stGlyph(st)}</button>
      <div class="hmeta">
        <div class="hname">${esc(h.name)}</div>
        <div class="hsub">${ya}${hora}<span>${stName(st)}</span>${meta}${k>1?`<span>🔥 ${k} días</span>`:""}${danger?`<span class="warn">no podés fallar</span>`:""}</div>
      </div>
      <button class="more" data-act="pick" data-h="${h.id}" aria-label="Elegir estado">⋯</button>
    </div>`;
  }).join("");

  return `
  <div class="card" style="padding:15px 16px">
    <div style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">
      ${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}${feriado ? " · feriado" : free ? " · fin de semana" : ""}</div>
    <div style="font-size:29px;font-weight:700;letter-spacing:-.03em;margin-top:2px">${done} de ${total} hoy</div>
    ${free ? `<div style="font-size:13px;color:var(--muted);margin-top:2px">Lo que no marques hoy queda en azul: no descuenta.</div>` : ""}
    ${isWeekend(TODAY) ? "" : `<button class="linkbtn" data-act="feriado">${feriado
      ? "¿Te toca trabajar? Tomalo como día hábil" : "¿Hoy es feriado? Tomalo como día libre"}</button>`}
  </div>
  ${alert}
  ${alertaComidasHTML()}
  ${alertaVencimientosHTML()}
  ${pendHTML}
  ${avisosHTML()}
  ${reflexionHTML()}
  ${finanzasHoyHTML()}
  <div class="stats">
    <div class="stat"><b style="color:var(--ok)">${r.victorias}</b><span>Victorias</span></div>
    <div class="stat"><b style="color:var(--fail)">${r.reglasRotas}</b><span>Reglas rotas</span></div>
    <div class="stat"><b>${r.mejorRacha}</b><span>Mejor racha</span></div>
  </div>
  ${noRompen(r.tropiezos, r.sinDato)}
  <div class="card">${rows || `<p style="color:var(--muted);margin:0">No hay hábitos. Agregalos desde <b>Más</b>.</p>`}

      <span><i style="background:var(--free)"></i>Azul: libre</span>

    </div>
  </div>
  <div class="card">
    <div class="card-t">Nota del día</div>
    <textarea id="note" rows="3" placeholder="¿Qué pasó hoy? ¿Qué te frenó?">${esc(S.notes[TODAY] || "")}</textarea>

}

/* ---------- pasos: día, semana, mes y año, como Samsung Health ---------- */
let PASOS_VISTA = "semana", PASOS_REF = TODAY, PASOS_ITEMS = [];
const MESES_CORTOS = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fmt = n => n.toLocaleString("es-AR");
function compacto(n){ return n >= 1000 ? String(Math.round(n / 100) / 10).replace(".", ",") + "K" : String(n); }
function fechaCorta(ds){ const d = parseISO(ds); return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES_CORTOS[d.getMonth()]}`; }
function tituloPasos(vista, desde, hasta){
  const a = parseISO(desde), b = parseISO(hasta);
  if(vista === "dia") return desde === TODAY ? "Hoy" : diasEntre(desde, TODAY) === 1 ? "Ayer" : cap(fechaCorta(desde));
  if(vista === "semana") return a.getMonth() === b.getMonth()
    ? `${a.getDate()} al ${b.getDate()} de ${MESES[b.getMonth()]}`
    : `${a.getDate()} ${MESES_CORTOS[a.getMonth()]} al ${b.getDate()} ${MESES_CORTOS[b.getMonth()]}`;
  if(vista === "mes") return `${cap(MESES[a.getMonth()])} ${a.getFullYear()}`;
  return String(a.getFullYear());
}

/* Columnas: verde si llegó a la meta, gris si no, azul si fue día libre (sin
   meta); la línea marca la meta. items: [{ eje, valor (null = sin dato), libre,
   titulo }]; destacar = índice a resaltar */
function barrasPasos(items, meta, destacar){
  const W = 340, H = 168, L = 30, R = 6, T = 14, B = 20;
  const max = Math.max(meta, ...items.map(i => i.valor || 0));
  const paso = max <= 8000 ? 2000 : max <= 20000 ? 5000 : 10000;
  const tope = Math.ceil(max / paso) * paso;
  const y = v => T + (H - T - B) * (1 - v / tope);
  const banda = (W - L - R) / items.length;
  const ancho = Math.min(24, Math.max(3, banda * 0.62)), radio = Math.min(4, ancho / 2);
  let fondo = "", barras = "", ejes = "";
  for(let v = 0; v <= tope; v += paso)
    fondo += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`
           + `<text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end" class="eje">${compacto(v)}</text>`;
  items.forEach((it, i) => {
    const cx = L + banda * (i + .5);
    if(it.eje) ejes += `<text x="${cx}" y="${H - 5}" text-anchor="middle" class="eje">${it.eje}</text>`;
    if(it.valor > 0){
      const y0 = y(0), y1 = Math.min(y(it.valor), y0 - 1), x0 = cx - ancho / 2, x1 = cx + ancho / 2;
      const r = Math.min(radio, y0 - y1);
      const tenue = destacar != null && i !== destacar ? ` opacity=".35"` : "";
      const color = it.libre ? "var(--free)" : it.valor >= meta ? "var(--ok)" : "var(--muted)";
      barras += `<path d="M${x0},${y0}V${y1 + r}Q${x0},${y1} ${x0 + r},${y1}H${x1 - r}Q${x1},${y1} ${x1},${y1 + r}V${y0}Z" `
              + `fill="${color}"${tenue}/>`;
    }
    barras += `<rect data-act="pbar" data-i="${i}" x="${L + banda * i}" y="${T}" width="${banda}" height="${H - T - B}" fill="transparent">`
            + `<title>${esc(it.titulo)}</title></rect>`;
  });
  const ym = y(meta);
  const linea = `<line x1="${L}" x2="${W - R}" y1="${ym}" y2="${ym}" stroke="var(--ink-2)" stroke-width="1" pointer-events="none"/>`
              + `<text x="${W - R}" y="${ym - 4}" text-anchor="end" class="eje fuerte" pointer-events="none"
                  stroke="var(--surface)" stroke-width="3" paint-order="stroke">Meta ${compacto(meta)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pasos por ${items.length === 12 ? "mes" : "día"}">${fondo}${barras}${linea}${ejes}</svg>`;
}

    PASOS_ITEMS = meses.map(x => ({ eje: MESES[x.mes][0].toUpperCase(), valor: x.dias ? x.promedio : null,
      titulo: x.dias ? `${cap(MESES[x.mes])}: ${fmt(x.promedio)} pasos por día · ${fmt(x.total)} en total` : `${cap(MESES[x.mes])}: sin datos` }));
    cuerpo = heroPasos(r.total, "pasos en el año") + statsPasos(r) + `<div class="card"><div class="card-t">Promedio diario de cada mes</div>
      ${barrasPasos(PASOS_ITEMS, meta)}<p class="pdet" id="pdet">Tocá un mes para ver el detalle</p>${lineaMeta(meta)}</div>`;
    filas = meses.filter(x => x.dias).map(x => `<tr><td>${cap(MESES[x.mes])}</td><td>${fmt(x.total)}</td><td>${fmt(x.promedio)}</td></tr>`);
    filas = filas.length ? `<tr><th>Mes</th><th>Total</th><th>Por día</th></tr>` + filas.join("") : "";
  } else {
    // Día: la semana de ese día, con el día resaltado
    const rango = PASOS_VISTA === "dia" ? rangoPasos("semana", PASOS_REF) : { desde, hasta };
    const r = resumenPasos(pasos, rango.desde, rango.hasta, meta, TODAY, esLibre);
    const mes = PASOS_VISTA === "mes";
    PASOS_ITEMS = r.serie.map(x => {
      const d = parseISO(x.fecha).getDate();
      return { fecha: x.fecha, valor: x.pasos, libre: x.libre,
        eje: mes ? (d === 1 || d % 5 === 0 ? String(d) : "") : DIAS[parseISO(x.fecha).getDay()],
        titulo: `${cap(fechaCorta(x.fecha))}: ` + (x.pasos == null ? "sin datos" : `${fmt(x.pasos)} pasos`) + (x.libre ? " · día libre" : "") };
    });
    const grafico = `<div class="card"><div class="card-t">Pasos por día</div>${barrasPasos(PASOS_ITEMS, meta,
      PASOS_VISTA === "dia" ? PASOS_ITEMS.findIndex(x => x.fecha === PASOS_REF) : null)}
      <p class="pdet" id="pdet">Tocá una barra para ver el día</p>${lineaMeta(meta)}</div>`;
    if(PASOS_VISTA === "dia"){
      const n = pasos[PASOS_REF], libre = esLibre(PASOS_REF);
      const previos = resumenPasos(pasos, iso(addDays(parseISO(PASOS_REF), -7)), iso(addDays(parseISO(PASOS_REF), -1)), meta, TODAY);
      const pct = n == null ? 0 : Math.round(100 * n / meta);
      const dif = n != null && previos.dias ? n - previos.promedio : null;
      const sub = n == null ? "sin datos de este día" : libre ? "pasos · día libre, sin meta" : `pasos · ${pct} % de la meta`;
      cuerpo = `<div class="card">${heroInner(n == null ? "—" : fmt(n), sub)}
        ${libre ? "" : `<div class="meter" role="meter" aria-valuemin="0" aria-valuemax="${meta}" aria-valuenow="${n ?? 0}" aria-label="Avance hacia la meta">
          <i style="width:${Math.min(100, pct)}%;background:${n >= meta ? "var(--ok)" : "var(--muted)"}"></i></div>`}</div>
        <div class="stats chico">
          <div class="stat"><b>${libre ? "Libre" : fmt(meta)}</b><span>Meta</span></div>
          <div class="stat"><b>${previos.dias ? fmt(previos.promedio) : "—"}</b><span>Promedio 7 días</span></div>
          <div class="stat"><b>${dif == null ? "—" : (dif >= 0 ? "+" : "−") + fmt(Math.abs(dif))}</b><span>Vs. promedio</span></div>
        </div>` + grafico;
    } else {
      cuerpo = heroPasos(r.total, PASOS_VISTA === "semana" ? "pasos en la semana" : "pasos en el mes") + statsPasos(r) + grafico;
    }
    filas = r.serie.filter(x => x.pasos != null).map(x => `<tr><td>${cap(fechaCorta(x.fecha))}</td><td>${fmt(x.pasos)}</td></tr>`);
    filas = filas.length ? `<tr><th>Día</th><th>Pasos</th></tr>` + filas.join("") : "";
  }

  const caminar = S.habits.find(h => h.auto?.source === "steps");
  const porMarcar = caminar ? planStepImport(S, pasos, TODAY).filter(p => p.action === "proponer").length : 0;
  const leido = NATIVO && PASOS_ESTADO?.ok
    ? `<p style="font-size:12px;color:var(--muted);margin:0 0 12px;text-align:center">Health Connect · actualizado a las
        ${String(PASOS_ESTADO.cuando.getHours()).padStart(2, "0")}:${String(PASOS_ESTADO.cuando.getMinutes()).padStart(2, "0")} ·
        <button class="linkbtn" data-act="hcActualizar" style="padding:0">Actualizar</button></p>` : "";
  const historial = NATIVO && PASOS_ESTADO?.ok ? `<div class="card"><p style="margin:0;font-size:13px;color:var(--ink-2);line-height:1.5">
      Health Connect trae hasta 30 días para atrás. Para el historial de antes, importá el archivo de pasos de Samsung Health
      (Samsung Health → Ajustes → Descargar datos personales; es el que termina en <i>step_daily_trend</i>).</p>
      <button class="btn ghost" data-act="importPasos">Importar historial (Samsung Health)</button></div>` : "";
  const vacio = !NATIVO && !Object.keys(pasos).length ? `<div class="card"><p style="margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.5">
      Todavía no hay pasos guardados.</p></div>` : "";

  // En la app, conectar Health Connect va arriba; en la web, el CSV queda al final
  return `${NATIVO ? tarjetaFuentePasos() : ""}${vacio}
  <div class="chips">${vistas}</div>${nav}
  ${cuerpo}${leido}
  ${porMarcar ? `<div class="alert good"><span class="ic">✓</span><div style="flex:1">Con tus pasos se pueden marcar
    <b>${porMarcar} ${porMarcar === 1 ? "día" : "días"}</b> de “${esc(caminar.name)}”.
    <button class="linkbtn" data-act="pmarcar">Revisar</button></div></div>` : ""}
  ${filas ? `<div class="card"><details><summary>Ver los números</summary><table class="tbl" style="margin-top:8px">${filas}</table></details></div>` : ""}
  ${historial}${NATIVO ? "" : tarjetaFuentePasos()}`;
}
function lineaMeta(meta){

}

function heroInner(valor, sub){ return `<div class="hero">${valor}<small>${sub}</small></div>`; }
function heroPasos(total, sub){ return `<div class="card">${heroInner(fmt(total), sub)}</div>`; }
function statsPasos(r){

/* ---------- comida: calorías y proteína del día ---------- */
function barra(valor, meta, color){
  const pct = meta ? Math.min(100, Math.round(100 * valor / meta)) : 0;
  return `<div class="meter" role="meter" aria-valuemin="0" aria-valuemax="${meta}" aria-valuenow="${valor}"><i style="width:${pct}%;background:${color}"></i></div>`;
}
function vComida(){

  const conClave = !!claveIA();
  const perfil = !m ? `<div class="card"><div class="card-t">Tu meta de calorías y proteína</div>

      ${barra(t.kcal, m.kcal, quedan >= 0 ? "var(--ok)" : "var(--fail)")}
      <p style="margin:14px 0 0;font-size:14.5px"><b>${fmt(t.prot)} g</b> de ${fmt(m.prot)} g de proteína${t.prot >= m.prot ? " ✓" : ` · faltan ${fmt(m.prot - t.prot)} g`}</p>
      ${barra(t.prot, m.prot, t.prot >= m.prot ? "var(--ok)" : "var(--muted)")}</div>`;

    <div class="row2" style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px">

    ${conClave ? "" : `<p style="font-size:12.5px;color:var(--muted);margin:10px 0 0;line-height:1.5">Para que Claude calcule desde una foto o desde lo que escribís, falta cargar tu clave de Anthropic (abajo, en “Calorías con Claude”).</p>`}</div>`;
  const hora = avisoComidasHora();

    : `<p style="margin:0;color:var(--muted);font-size:13.5px">Todavía no cargaste nada hoy.</p>`}

      <tr><th>Día</th><th>Calorías</th><th>Proteína</th></tr>
      ${dias.map(d => { const x = totalComidas(S.comidas?.[d]); const vacio = !(S.comidas?.[d] || []).length;
        return `<tr class="tap${d === TODAY ? " tr-today" : ""}" data-act="cdia" data-d="${d}"><td>${cap(fechaCorta(d))}</td>
          <td class="${vacio ? "n" : x.kcal <= m.kcal ? "g" : "y"}">${vacio ? "—" : fmt(x.kcal)}</td>
          <td class="${vacio ? "n" : x.prot >= m.prot ? "g" : ""}">${vacio ? "—" : fmt(x.prot) + " g"}</td></tr>`; }).join("")}
      </table><p style="font-size:12px;color:var(--muted);margin:8px 0 0">Tocá un día para ver qué comiste. Verde: calorías dentro de la meta o proteína alcanzada. Amarillo: te pasaste de calorías.</p></div>` : "";
  const cuerpo = m ? `<div class="card"><div class="card-t">Tu meta</div>

        ${m.faltan ? `· faltan ${fmt1(m.faltan)} kg (≈ ${m.semanas} ${m.semanas === 1 ? "semana" : "semanas"} a ${fmt1(p.ritmo)} kg por semana)` : "· ¡llegaste! La meta es mantener"}</p>
      ${lineaCintura(p)}
      <p style="margin:6px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5">Gastás unas ${fmt(m.gasto)} kcal por día (base ${fmt(m.tmb)}, Mifflin-St Jeor por tu actividad)${m.deficit ? `; para bajar ${fmt1(p.ritmo)} kg por semana comés ${fmt(m.deficit)} menos` : ""}. Proteína: 1,8 g por kilo. Son estimaciones: si en 2 o 3 semanas el peso no se mueve, bajá un poco la meta.</p>

/* Una comida en una lista: tocándola se edita; la ✕ la borra */
function filaComida(c, i, fecha){
  return `<div class="comida">
      <button class="ce" data-act="ceditar" data-d="${fecha}" data-i="${i}" aria-label="Editar ${esc(c.nombre)}">
        <span class="hm">${TIPOS_COMIDA[tipoDe(c)]}${c.hora ? `<small>${esc(c.hora)}</small>` : ""}</span>
        <span class="n">${esc(c.nombre)}</span><b>${fmt(c.kcal)} kcal</b><span class="pg">${fmt(c.prot)} g</span></button>
      <button class="x" data-act="cborrar" data-d="${fecha}" data-i="${i}" aria-label="Borrar ${esc(c.nombre)}">✕</button></div>`;
}
/* En orden del día; las que no tienen hora van donde suele ir su comida */
const HORA_TIPO = { desayuno: "08:00", almuerzo: "13:00", merienda: "18:00", cena: "21:30", colacion: "23:59" };
function ordenComidas(lista){
  return (lista || []).map((c, i) => [c, i]).sort(([a], [b]) => (a.hora || HORA_TIPO[tipoDe(a)]).localeCompare(b.hora || HORA_TIPO[tipoDe(b)]));
}
function filaFrecuente(f){
  return `<button class="frec" data-act="cfrec" data-id="${f.id}" aria-label="Agregar ${esc(f.nombre)}">
    <span>${esc(f.nombre)}</span><b>${fmt(f.kcal)} kcal</b><small>${fmt(f.prot)} g</small><i>+</i></button>`;
}
function selectTipo(id, valor){
  return `<select id="${id}">${Object.entries(TIPOS_COMIDA).map(([k, t]) => `<option value="${k}"${k === valor ? " selected" : ""}>${t}</option>`).join("")}</select>`;
}

/* ---- aviso de comidas: a las 22 (o la hora elegida), si falta alguna de las cuatro ---- */
function avisoComidasHora(){ const v = S.settings.avisoComidas; return v === "no" ? null : esHora(v) ? v : "22:00"; }
function usaComidas(){ return !!S.perfil || Object.keys(S.comidas || {}).length > 0; }

/* ---- frecuentes: se guardan por tipo y nombre ---- */
const normNombre = t => String(t).trim().toLowerCase().replace(/\s+/g, " ");
function buscarFrecuente(tipo, nombre){ return (S.frecuentes || []).find(f => f.tipo === tipo && normNombre(f.nombre) === normNombre(nombre)); }
function guardarFrecuente({ tipo, nombre, kcal, prot }){
  const f = buscarFrecuente(tipo, nombre);
  if(f) Object.assign(f, { nombre: nombre.slice(0, 80), kcal, prot });
  else (S.frecuentes ||= []).push({ id: uid(), tipo, nombre: nombre.slice(0, 80), kcal, prot });
}
function sacarFrecuente(tipo, nombre){
  S.frecuentes = (S.frecuentes || []).filter(f => !(f.tipo === tipo && normNombre(f.nombre) === normNombre(nombre)));
}
function agregarFrecuente(id){
  const f = (S.frecuentes || []).find(x => x.id === id); if(!f) return;
  closeSheet();
  guardarComida({ nombre: f.nombre, kcal: f.kcal, prot: f.prot, tipo: f.tipo, origen: "frecuente" });
}
function verFrecuentes(){
  const frecs = S.frecuentes || [];
  sheet(`<h3>Frecuentes</h3><p class="sub">${frecs.length ? "Tocá una para sumarla hoy." : "Todavía no hay."} Para agregar una, tocá una comida que ya cargaste y tildá «Guardar en frecuentes».</p>
    ${Object.keys(TIPOS_COMIDA).filter(t => frecs.some(f => f.tipo === t)).map(t => `<p class="frec-t">${TIPOS_COMIDA[t]}</p>
      ${frecs.filter(f => f.tipo === t).map(f => `<div class="frow">${filaFrecuente(f)}<button class="x" data-q="${f.id}" aria-label="Sacar ${esc(f.nombre)} de frecuentes">✕</button></div>`).join("")}`).join("")}
    <button class="btn ghost" data-x="c">Cerrar</button>`);
  modal.querySelector('[data-x="c"]').onclick = closeSheet;
  modal.querySelectorAll('[data-act="cfrec"]').forEach(b => b.onclick = () => agregarFrecuente(b.dataset.id));
  modal.querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
    S.frecuentes = frecs.filter(f => f.id !== b.dataset.q); save(); render(); verFrecuentes(); toast("Sacada de frecuentes");
  });
}

/* ---- editar, borrar e historial ---- */
function borrarComida(fecha, i){
  const l = S.comidas?.[fecha]; if(!l?.[i]) return;
  l.splice(i, 1);
  if(!l.length) delete S.comidas[fecha];
  save();
}
function confirmarBorrado(fecha, i, volver){
  const c = S.comidas?.[fecha]?.[i]; if(!c) return;
  confirmSheet("¿Borrar esta comida?", `${c.nombre} · ${fmt(c.kcal)} kcal`, "Borrar", () => { borrarComida(fecha, i); render(); volver?.(); });
}
function editarComida(fecha, i, volver){
  const c = S.comidas?.[fecha]?.[i]; if(!c) return;
  const tipo = tipoDe(c), eraFrec = !!buscarFrecuente(tipo, c.nombre);
  sheet(`<h3>Editar comida</h3><p class="sub">${cap(fechaCorta(fecha))}${c.origen === "foto" ? " · calculada desde una foto" : c.origen === "texto" ? " · calculada por Claude" : ""}</p>
    <label class="campo">Qué comiste</label><input type="text" id="eNombre" maxlength="120" value="${esc(c.nombre)}">
    <div class="row2" style="display:grid;grid-template-columns:1fr 1fr;gap:9px">
      <div><label class="campo">Comida</label>${selectTipo("eTipo", tipo)}</div>
      <div><label class="campo">Hora</label><input type="time" id="eHora" value="${esc(c.hora || "")}"></div>
      <div><label class="campo">Calorías (kcal)</label><input type="number" id="eKcal" inputmode="numeric" min="0" max="5000" value="${c.kcal}"></div>
      <div><label class="campo">Proteína (g)</label><input type="number" id="eProt" inputmode="numeric" min="0" max="400" value="${c.prot}"></div></div>
    ${c.detalle?.length ? `<p class="detalle">${c.detalle.map(d => `${esc(d.nombre)} · ${fmt(d.kcal)} kcal · ${fmt(d.prot)} g`).join("<br>")}</p>` : ""}
    <label class="chk"><input type="checkbox" id="eFrec"${eraFrec ? " checked" : ""}> Guardar en frecuentes</label>
    <div class="row2"><button class="btn ghost danger" data-x="b">Borrar</button><button class="btn" data-x="o">Guardar</button></div>`);
  const $ = q => modal.querySelector(q);

/* Historial: un día por vez, con ‹ › para ir y volver */
function verDia(fecha){

  const primero = Object.keys(S.comidas || {}).sort()[0] || TODAY, faltan = faltanComidas(lista);
  const mover = n => verDia(iso(addDays(parseISO(fecha), n)));
  sheet(`<div class="mnav" style="box-shadow:none"><button data-x="ant" aria-label="Día anterior"${fecha <= primero ? " disabled" : ""}>‹</button>
      <b>${fechaCorta(fecha)}</b><button data-x="sig" aria-label="Día siguiente"${fecha >= TODAY ? " disabled" : ""}>›</button></div>
    <p class="sub">${lista.length ? `<b>${fmt(t.kcal)} kcal</b>${m ? ` de ${fmt(m.kcal)}` : ""} · <b>${fmt(t.prot)} g</b>${m ? ` de ${fmt(m.prot)} g` : ""} de proteína`
      : "Ese día no cargaste comidas."}</p>
    ${ordenComidas(lista).map(([c, i]) => filaComida(c, i, fecha)).join("")}
    ${lista.length && faltan.length ? `<p class="pie">Sin cargar: ${nombresComidas(faltan)}.</p>` : ""}

  modal.querySelectorAll('[data-act="cborrar"]').forEach(b => b.onclick = () => confirmarBorrado(fecha, +b.dataset.i, () => verDia(fecha)));

function horaAhora(){ const d = new Date(); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
/* Hoy lleva la hora de ahora; un día pasado, la que se cargó (o ninguna) */
function guardarComida(c, fecha = TODAY){

function aPesos(n){ return (n < 0 ? "− $ " : "$ ") + fmt(Math.abs(Math.round(n))); }
function conSigno(n){ return (n < 0 ? "− $ " : "+ $ ") + fmt(Math.abs(Math.round(n))); }

/* ---- a dónde vas: frases con tus números, en Finanzas y en Hoy ---- */
function frasesRumbo(F){
  const r = rumboFinanzas(F, TODAY), nombre = m => MESES[Number(m.slice(5)) - 1], out = [];
  const lista = l => esc(l.length > 1 ? l.slice(0, -1).join(", ") + " y " + l.at(-1) : l[0]);
  out.push(`${cap(nombre(r.mes))}: ${r.sobra >= 0 ? `te sobran <b>${aPesos(r.sobra)}</b>` : `te faltan <b>${aPesos(-r.sobra)}</b>`}.`
    + (r.cierraDesde ? ` Desde ${nombreMes(r.cierraDesde)}, todos los meses cierran solos.` : ""));
  if(r.terminan) out.push(`En ${nombreMes(r.terminan.mes)} terminás ${lista(r.terminan.nombres)}${r.terminan.libera ? `: se liberan <b>${aPesos(r.terminan.libera)}</b> por mes` : ""}.`);
  if(r.cuotas.despues > 0 && r.cuotas.despues < r.cuotas.ahora)
    out.push(`Las cuotas bajan de ${aPesos(r.cuotas.ahora)} en ${nombre(r.mes)} a <b>${aPesos(r.cuotas.despues)}</b> en ${nombreMes(r.cuotas.mes)}.`);
  if(r.ultima) out.push(`La última cuota de todas es en ${nombreMes(r.ultima)}: desde ahí, sin deudas.`);
  if(r.hito?.mes) out.push(`En ${nombreMes(r.hito.mes)} llegás a ${r.hito.meses === 1 ? "un mes" : r.hito.meses + " meses"} de gastos en el colchón.`);
  if(r.alimentos) out.push(`Alimentos: ${aPesos(r.alimentos.gastado)} de ${aPesos(r.alimentos.presupuesto)}, ${r.alimentos.gastado <= r.alimentos.tope
    ? "vas al ritmo." : `te adelantaste <b>${aPesos(r.alimentos.gastado - r.alimentos.tope)}</b> al ritmo.`}`);
  const sd = S.habits.find(h => h.auto?.source === "finanzas" && h.auto.regla === "sinDeuda"), n = sd ? streak(sd.id) : 0;
  if(n > 1) out.push(`Llevás <b>${n} días</b> sin deuda nueva.`);
  if(r.vencimientos.total) out.push(`De ${nombre(r.mes)} pagaste ${r.vencimientos.pagados} de ${r.vencimientos.total} vencimientos; falta <b>${aPesos(r.vencimientos.falta)}</b>.`);
  return out;
}

/* ---- listas: lo que entra, la casa, las deudas y el colchón ---- */
const LISTAS_FIN = {

/* Alta y edición, con los campos de LISTAS_FIN. Con `volver`, al terminar vuelve a la lista. */
function editarItemFin(tipo, id, volver){
  const L = LISTAS_FIN[tipo], F = fin(), x = id ? F[tipo].find(y => y.id === id) : null;
  if(id && !x) return;
  const valor = k => k === "aguinaldo" ? !!x?.meses?.length : x?.[k] ?? "";
  const campo = ([k, t, c]) => c === "check" ? `<label class="chk"><input type="checkbox" id="f_${k}"${valor(k) ? " checked" : ""}> ${t}</label>`
    : `<label class="campo" for="f_${k}">${t}</label>` + (c === "texto" ? `<input type="text" id="f_${k}" maxlength="60" value="${esc(valor(k))}">`
    : c === "mes" ? `<input type="month" id="f_${k}" value="${esc(valor(k))}">`
    : `<input type="number" id="f_${k}" inputmode="${c === "tasa" ? "decimal" : "numeric"}" min="${c === "dia" ? 1 : 0}"${c === "dia" ? ' max="31"' : ""} step="${c === "tasa" ? "0.01" : "1"}" value="${esc(valor(k))}">`);
  const plan = tipo === "deudas" && x?.plan ? Object.entries(x.plan).sort() : [];
  sheet(`<h3>${x ? esc(x.nombre) : L.nuevo}</h3><p class="sub">${L.sub}</p>${L.campos.map(campo).join("")}
    ${plan.length ? `<p class="detalle">Cuotas distintas: ${plan.map(([m, n]) => `${mesCorto(m)} ${aPesos(n)}`).join(" · ")}.</p>` : ""}
    <div class="row2">${x ? `<button class="btn ghost danger" data-x="b">Borrar</button>` : `<button class="btn ghost" data-x="c">Cancelar</button>`}
      <button class="btn" data-x="o">Guardar</button></div>`);
  const $ = q => modal.querySelector(q), salir = () => volver ? verListaFin(tipo) : closeSheet();
  if(x) $('[data-x="b"]').onclick = () => confirmSheet(`¿Borrar ${x.nombre}?`, "Se saca de tus finanzas.", "Borrar", () => {
    F[tipo] = F[tipo].filter(y => y.id !== id); save(); render(); if(volver) verListaFin(tipo); });
  else $('[data-x="c"]').onclick = salir;
  $('[data-x="o"]').onclick = () => {
    const nuevo = {};
    for(const [k, t, c] of L.campos){
      const el = $("#f_" + k), v = c === "check" ? el.checked : el.value.trim();
      if(c === "texto"){ if(!v){ toast("Falta el nombre"); return; } nuevo[k] = v.slice(0, 60); }
      else if(c === "plata"){ const n = Math.round(Number(v)); if(v === "" || !(n >= 0 && n <= 1e10)){ toast(`Revisá «${t}»`); return; } nuevo[k] = n; }
      else if(c === "check"){ if(v) nuevo.meses = [6, 12]; }
      else if(v === "") continue;
      else if(c === "dia"){ const n = Number(v); if(!(Number.isInteger(n) && n >= 1 && n <= 31)){ toast("El día va del 1 al 31"); return; } nuevo[k] = n; }
      else if(c === "tasa"){ const n = Number(v.replace(",", ".")); if(!(n >= 0 && n <= 1000)){ toast("La tasa va en porcentaje, por ejemplo 55"); return; } nuevo[k] = n; }
      else if(c === "mes"){ if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(v)){ toast("Elegí el mes de la última cuota"); return; } nuevo[k] = v; }
    }
    if(x){ for(const [k] of L.campos) delete x[k === "aguinaldo" ? "meses" : k]; Object.assign(x, nuevo); }
    else F[tipo].push({ id: uid(), ...nuevo, ...(tipo === "deudas" ? { alta: TODAY } : {}) });   // la fecha cuenta para "Sin deuda nueva"
    save(); render(); salir(); toast(x ? "Guardado" : "Agregado");
  };
  if(!x) $("#f_nombre").focus();
}

function marcarPagado(mes, clave){

function renglonesTicket(items){

function editarGasto(fecha, i){

  sheet(`<h3>${esc(g.comercio)}</h3><p class="sub">${cap(fechaCorta(fecha))}${g.origen === "ticket" ? " · leído de la foto del ticket" : ""}</p>

function borrarGasto(fecha, i){

function confirmarBorradoGasto(fecha, i){

}

function bind(){

/* Enganche 5: toque largo sobre un hábito con meta -> cargar el valor real.
   Un toque normal sigue siendo "cumplí la meta" y no pide ningún número. */
let longPressFired = false;
function bindLongPress(){
  view.querySelectorAll('.dot[data-goal="1"]').forEach(el => {
    let timer = null;
    const start = () => {
      clearTimeout(timer);
      timer = setTimeout(() => { longPressFired = true; valorSheet(TODAY, el.dataset.h); }, 500);
    };
    const cancel = () => clearTimeout(timer);
    el.addEventListener("pointerdown", start);
    el.addEventListener("pointerup", cancel);
    el.addEventListener("pointerleave", cancel);
    el.addEventListener("pointercancel", cancel);
    el.addEventListener("contextmenu", e => e.preventDefault());
  });
}

function valorSheet(date, hid){
  const h = S.habits.find(x => x.id === hid);
  if(!h?.goal) return;
  const g = h.goal, actual = S.values?.[date]?.[hid];
  sheet(`<h3>${esc(h.name)}</h3>
    <p class="sub">Meta ${g.meta} ${esc(g.unidad)} · piso ${g.piso} ${esc(g.unidad)}. Abajo del piso queda amarillo.</p>
    <input type="number" id="pv" inputmode="numeric" min="0" step="1" value="${actual != null ? actual : g.meta}">
    <div class="row2"><button class="btn ghost" data-x="c" style="margin:0">Cancelar</button>
    <button class="btn" data-x="o" style="margin:0">Guardar</button></div>`);
  const inp = modal.querySelector("#pv");
  inp.focus(); inp.select();
  modal.querySelector('[data-x="c"]').onclick = closeSheet;
  const ok = () => {
    const v = parseInt(inp.value, 10);
    closeSheet();
    if(Number.isFinite(v) && v >= 0){ setValor(S, date, hid, v); render(); }
  };
  modal.querySelector('[data-x="o"]').onclick = ok;
  inp.addEventListener("keydown", e => { if(e.key === "Enter") ok(); });
}

function onAct(e){
  const el = e.currentTarget, a = el.dataset.act, hid = el.dataset.h;
  switch(a){
    case "quick": {
      if(longPressFired){ longPressFired = false; break; }   // fue toque largo, no toque
      const st = getMark(TODAY, hid);
      if(st === ST.GREEN) applyMark(TODAY, hid, null);
      else applyMark(TODAY, hid, ST.GREEN);
      break;
    }
    case "pick": openPicker(TODAY, hid); break;
    case "wh": weekHabit = hid; render(); break;
    case "prevM": cursor.m--; if(cursor.m < 0){ cursor.m = 11; cursor.y--; } render(); break;
    case "nextM": cursor.m++; if(cursor.m > 11){ cursor.m = 0; cursor.y++; } render(); break;
    case "addH": addHabit(); break;
    case "delH": confirmSheet("¿Borrar hábito?", "Se borra también su historial de marcas.", "Borrar", () => borrarHabito(hid)); break;
    case "editH": editHabit(hid); break;
    case "pend": applyMark(el.dataset.d, hid, el.dataset.st); break;
    case "reflexion": verReflexion(); break;
    case "feriado": {
      /* Alterna hoy entre libre y hábil: saca o agrega en la lista que corresponda */
      const quitar = (arr, ds) => { const i = arr.indexOf(ds); if(i >= 0) arr.splice(i, 1); return i >= 0; };
      S.feriados ||= []; S.laborables ||= [];
      if(esFeriado(TODAY)){ quitar(S.feriados, TODAY); if(esFeriado(TODAY)) S.laborables.push(TODAY); }
      else { quitar(S.laborables, TODAY); if(!esFeriado(TODAY)) S.feriados.push(TODAY); }
      save(); render(); break;
    }
    case "ics": doICS(); break;
    case "probarAviso": probarAviso(); break;
    case "pvista": PASOS_VISTA = el.dataset.v; render(); break;
    case "pmover": {
      const ref = moverPasos(PASOS_VISTA, PASOS_REF, +el.dataset.n);
      PASOS_REF = ref > TODAY ? TODAY : ref;
      render(); break;
    }
    case "pbar": { const it = PASOS_ITEMS[+el.dataset.i]; if(it) document.getElementById("pdet").textContent = it.titulo; break; }
    case "pmarcar": marcarConPasos(); break;
    case "hcConectar": sincronizarPasos(true); break;
    case "hcActualizar": sincronizarPasos(); break;
    case "hcInstalar": nativo("HealthPlugin", "showHealthConnectInPlayStore").catch(() => {}); break;
    case "hcAbrir": nativo("HealthPlugin", "openHealthConnectSettings").catch(() => toast("No se pudo abrir Health Connect")); break;
    case "pmeta": editarMetaPasos(); break;
    case "cperfil": editarPerfil(); break;
    case "cpeso": registrarPeso(); break;
    case "cmano": comidaAMano(); break;
    case "cfoto": elegirFoto(true); break;
    case "cgaleria": elegirFoto(false); break;
    case "cclave": editarClave(); break;
    case "cborrar": confirmarBorrado(el.dataset.d || TODAY, +el.dataset.i); break;
    case "ceditar": editarComida(el.dataset.d || TODAY, +el.dataset.i); break;
    case "cdia": verDia(el.dataset.d); break;
    case "cfrec": agregarFrecuente(el.dataset.id); break;
    case "cfrecs": verFrecuentes(); break;
    case "caviso": editarAvisoComidas(); break;
    case "irComida": TAB = "comida"; render(); break;
    case "irFinanzas": TAB = "finanzas"; render(); break;
    case "fmes": {
      const F = fin(), m = sumarMeses(FIN_MES || mesDelPlan(F), +el.dataset.n);
      FIN_MES = F.inicio && m < F.inicio ? F.inicio : m; render(); break;
    }
    case "fir": FIN_MES = el.dataset.m; render(); break;
    case "amover": { const m = sumarMeses(ALIM_MES || mesDe(TODAY), +el.dataset.n); ALIM_MES = m >= mesDe(TODAY) ? null : m; render(); break; }
    case "fpagar": marcarPagado(el.dataset.m, el.dataset.k); break;
    case "fticket": elegirFoto(true, [], "", FOTO_TICKET); break;
    case "fgaleria": elegirFoto(false, [], "", FOTO_TICKET); break;
    case "fmano": gastoAMano(); break;
    case "fgasto": editarGasto(el.dataset.d, +el.dataset.i); break;
    case "fborrarGasto": confirmarBorradoGasto(el.dataset.d, +el.dataset.i); break;
    case "fpres": editarPresupuesto(); break;
    case "flista": verListaFin(el.dataset.k); break;
    case "fitem": editarItemFin(el.dataset.k, el.dataset.id || null); break;
    case "fmov": nuevoMovimiento(el.dataset.m); break;
    case "fborrarMov": { const F = fin(); F.movimientos = F.movimientos.filter(m => m.id !== el.dataset.id); save(); render(); toast("Sacado"); break; }
    case "fimport": doImportFinanzas(); break;
    case "rumbo": verRumbo(); break;
    case "fhabito": alternarHabitoFin(el.dataset.r); break;
    case "up": {
      const hs = habitsSorted(), i = hs.findIndex(h => h.id === hid);
      if(i > 0){ const a1 = hs[i].order ?? i, b1 = hs[i-1].order ?? (i-1); hs[i].order = b1; hs[i-1].order = a1; save(); render(); }
      break;
    }
    case "addL": addListItem(el.dataset.k); break;
    case "delL": { (el.dataset.k === "less" ? S.doLess : S.doMore).splice(+el.dataset.i, 1); save(); render(); break; }
    case "tex": S.settings.texture = !S.settings.texture; save(); render(); break;
    case "export": doExport(); break;
    case "import": doImport(); break;
    case "importPasos": doImportPasos(); break;
    case "reset": confirmSheet("¿Borrar todo?", "Se pierden hábitos, marcas y notas. No se puede deshacer.", "Borrar todo", () => {
        S = seed(); save(); cursor = { y:new Date().getFullYear(), m:new Date().getMonth() }; TAB = "hoy"; render();
      }); break;
  }
}

/* Aplica una marca respetando la regla de los 2 amarillos.
   Enganche 3: si la tocaste vos, la marca pasa a ser tuya y deja de ser
   del cierre automático. Vale para Hoy y para las celdas de la rueda. */
function applyMark(date, hid, st, skipCheck){
  if(st === ST.YELLOW && !skipCheck && prevIsYellow(date, hid)){
    const h = S.habits.find(x => x.id === hid);
    confirmSheet("⚠ Estás por romper la regla",
      `Este sería el 2º amarillo seguido en “${h.name}”. La regla del sistema es que nunca haya dos días fallados seguidos.`,
      "Marcar igual", () => { setMark(date, hid, st); markManual(S, date, hid); save(); render(); });
    return;
  }
  setMark(date, hid, st);
  markManual(S, date, hid);
  save();
  render();
}

/* ---------- sheets ---------- */
const modal = document.getElementById("modal");
function closeSheet(){ modal.innerHTML = ""; }
function sheet(html){
  modal.innerHTML = `<div class="scrim"><div class="sheet">${html}</div></div>`;
  modal.querySelector(".scrim").addEventListener("click", e => { if(e.target === e.currentTarget) closeSheet(); });
}
function openPicker(date, hid){
  const h = S.habits.find(x => x.id === hid); if(!h) return;
  const cur = getMark(date, hid), d = parseISO(date);
  const opt = (st, cls, gl, t, sub) => `<button class="opt ${cur===st?"sel":""}" data-st="${st||""}">
    <i class="${cls}">${gl}</i><span><b>${t}</b><small>${sub}</small></span></button>`;
  sheet(`<h3>${esc(h.name)}</h3><p class="sub">${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}${
      cur === ST.NODATA ? " · sin dato: quedó sin marcar ese día" : ""}</p>
    ${opt(ST.GREEN,"i-green","✓","Verde","Lo hice")}
    ${opt(ST.YELLOW,"i-yellow","✕","Amarillo","No lo hice")}
    ${opt(ST.BLUE,"i-blue","–","Azul","Libre, no era obligatorio")}
    ${opt("","i-none","·","Sin marcar","Dejarlo en blanco")}`);
  modal.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const st = b.dataset.st || null; closeSheet(); applyMark(date, hid, st);
  });
}
function confirmSheet(title, sub, okText, fn){
  sheet(`<h3>${esc(title)}</h3><p class="sub">${esc(sub)}</p>
    <div class="row2"><button class="btn ghost" data-x="c" style="margin:0">Cancelar</button>
    <button class="btn" data-x="o" style="margin:0">${esc(okText)}</button></div>`);
  modal.querySelector('[data-x="c"]').onclick = closeSheet;
  modal.querySelector('[data-x="o"]').onclick = () => { closeSheet(); fn(); };
}
function toast(msg){
  const t = document.createElement("div");
  t.textContent = msg;
  t.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:60;background:var(--ink);color:var(--bg);"
    + "padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:var(--shadow)";
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1900);
}

/* ---------- CRUD ---------- */
function borrarHabito(hid){

/* Valida el respaldo entero antes de tocar nada. Devuelve el estado listo
   para usar o tira un Error con el motivo; S y localStorage no se tocan. */
function prepararRespaldo(texto){
  let data;
  try{ data = JSON.parse(texto); }catch(e){ throw new Error("No es un archivo JSON."); }
  const esObj = x => x !== null && typeof x === "object" && !Array.isArray(x);
  const esFecha = x => typeof x === "string" && /^\d{4}-\d{2}-\d{2}$/.test(x);
  if(!esObj(data) || !Array.isArray(data.habits) || !esObj(data.marks))
    throw new Error("No parece un respaldo de Mi Prime.");
  if(!data.habits.every(h => esObj(h) && typeof h.name === "string" && h.name.trim()))
    throw new Error("Hay hábitos sin nombre.");
  if(!esFecha(data.createdAt)) throw new Error("Le falta la fecha de creación.");
  const estados = new Set([ST.GREEN, ST.YELLOW, ST.BLUE]);
  for(const [d, dia] of Object.entries(data.marks)){
    if(!esFecha(d) || !esObj(dia) || !Object.values(dia).every(v => estados.has(v)))
      throw new Error(`Marca inválida el ${d}.`);
  }
  if(!data.habits.every(h => h.id == null || (typeof h.id === "string" && /^[\w-]+$/.test(h.id))))
    throw new Error("Hay un hábito con un id inválido.");
  if(!data.habits.every(h => (h.hora == null || esHora(h.hora)) && (h.hasta == null || esHora(h.hasta))))
    throw new Error("Hay un horario mal escrito.");
  for(const k of ["feriados", "laborables"])
    if(data[k] != null && !(Array.isArray(data[k]) && data[k].every(esFecha))) throw new Error(`El campo "${k}" está roto.`);
  const forma = { notes:esObj, doLess:Array.isArray, doMore:Array.isArray, settings:esObj, autoClosed:esObj, values:esObj, pasos:esObj, marcasFin:esObj };
  for(const [k, ok] of Object.entries(forma))
    if(data[k] != null && !ok(data[k])) throw new Error(`El campo "${k}" está roto.`);
  if(data.pasos && !Object.entries(data.pasos).every(([d, n]) => esFecha(d) && Number.isInteger(n) && n >= 0))
    throw new Error(`El campo "pasos" está roto.`);
  const esNum = x => typeof x === "number" && Number.isFinite(x) && x >= 0;
  for(const k of ["pesos", "cinturas"])
    if(data[k] != null && !(esObj(data[k]) && Object.entries(data[k]).every(([d, n]) => esFecha(d) && esNum(n))))
      throw new Error(`El campo "${k}" está roto.`);
  if(data.comidas != null && !(esObj(data.comidas) && Object.entries(data.comidas).every(([d, l]) => esFecha(d) && Array.isArray(l)
      && l.every(c => esObj(c) && typeof c.nombre === "string" && esNum(c.kcal) && esNum(c.prot) && (c.tipo == null || Object.hasOwn(TIPOS_COMIDA, c.tipo))))))
    throw new Error(`El campo "comidas" está roto.`);
  if(data.frecuentes != null && !(Array.isArray(data.frecuentes) && data.frecuentes.every(f => esObj(f) && typeof f.nombre === "string"
      && esNum(f.kcal) && esNum(f.prot) && Object.hasOwn(TIPOS_COMIDA, f.tipo))))
    throw new Error(`El campo "frecuentes" está roto.`);
  if(data.perfil != null && !esObj(data.perfil)) throw new Error(`El campo "perfil" está roto.`);
  if(data.autoClosed && !Object.values(data.autoClosed).every(Array.isArray))
    throw new Error(`El campo "autoClosed" está roto.`);
  if(data.marcasFin && !Object.entries(data.marcasFin).every(([d, l]) => esFecha(d) && Array.isArray(l)))
    throw new Error(`El campo "marcasFin" está roto.`);
  if(data.settings?.lastClosed != null && !esFecha(data.settings.lastClosed))
    throw new Error("La fecha del último cierre está rota.");
  if(data.finanzas != null) validarFinanzas(data.finanzas);
  migrate(data);
  migrateV2(data, TODAY);
  return data;
}

/* Las finanzas, enteras, antes de tocar nada; tira un Error con el motivo */
function validarFinanzas(f){
  const esObj = x => x !== null && typeof x === "object" && !Array.isArray(x);
  const esFecha = x => typeof x === "string" && /^\d{4}-\d{2}-\d{2}$/.test(x);
  const esMes = x => typeof x === "string" && /^\d{4}-(0[1-9]|1[0-2])$/.test(x);
  const plata = x => typeof x === "number" && Number.isFinite(x) && x >= 0;
  const texto = x => typeof x === "string" && x.trim().length > 0;
  const dia = x => x == null || (Number.isInteger(x) && x >= 1 && x <= 31);
  if(!esObj(f)) throw new Error(`El campo "finanzas" está roto.`);
  const listas = {
    ingresos: i => plata(i.monto) && dia(i.dia) && (i.meses == null || (Array.isArray(i.meses) && i.meses.every(m => Number.isInteger(m) && m >= 1 && m <= 12))),
    fijos: x => plata(x.monto) && dia(x.dia),
    deudas: d => plata(d.saldo) && plata(d.cuota) && (d.tna == null || plata(d.tna)) && dia(d.dia) && (d.hasta == null || esMes(d.hasta)) && (d.alta == null || esFecha(d.alta))
      && (d.plan == null || (esObj(d.plan) && Object.entries(d.plan).every(([m, n]) => esMes(m) && plata(n)))),
    movimientos: m => esMes(m.mes) && typeof m.monto === "number" && Number.isFinite(m.monto) && (m.alta == null || esFecha(m.alta)),
    colchon: c => plata(c.monto)
  };
  for(const [k, ok] of Object.entries(listas))
    if(f[k] != null && !(Array.isArray(f[k]) && f[k].every(x => esObj(x) && typeof x.id === "string" && /^[\w-]+$/.test(x.id) && texto(x.nombre) && ok(x))))
      throw new Error(`En finanzas, "${k}" está roto.`);
  if(f.gastos != null && !(esObj(f.gastos) && Object.entries(f.gastos).every(([d, l]) => esFecha(d) && Array.isArray(l)
      && l.every(g => esObj(g) && typeof g.comercio === "string" && plata(g.total) && (g.items == null || Array.isArray(g.items))))))
    throw new Error(`En finanzas, "gastos" está roto.`);
  if(f.pagos != null && !(esObj(f.pagos) && Object.entries(f.pagos).every(([m, l]) => esMes(m) && Array.isArray(l) && l.every(x => typeof x === "string"))))
    throw new Error(`En finanzas, "pagos" está roto.`);
  if(f.inicio != null && !esMes(f.inicio)) throw new Error("En finanzas, el mes de inicio está roto.");
  if(f.presupuestoAlimentos != null && !plata(f.presupuestoAlimentos)) throw new Error("En finanzas, el presupuesto de alimentos está roto.");
}

/* =========================================================================
   8. APP DE ANDROID: avisos a la hora de cada hábito
   -------------------------------------------------------------------------
   Instalada como app (Capacitor), esta misma página programa avisos locales:
   los da el propio celular a la hora exacta, sin internet ni servidor. Se
   reprograman después de cada cambio para los próximos 14 días. Se habla con
   los plugins por Capacitor.nativePromise, que trae la app: no hace falta
   empaquetar nada. En la web NATIVO es false y nada de esto corre.
   ========================================================================= */
const nativo = (plugin, metodo, opciones = {}) => window.Capacitor.nativePromise(plugin, metodo, opciones);

function programarAvisosPronto(){
  if(!NATIVO) return;
  clearTimeout(avisosTimer);
  avisosTimer = setTimeout(programarAvisos, 600);
}
async function programarAvisos(){
  try{
    let perm = await nativo("LocalNotifications", "checkPermissions");
    if(perm.display !== "granted") perm = await nativo("LocalNotifications", "requestPermissions");
    if(perm.display !== "granted"){ AVISOS_ESTADO = { error: "La app no tiene permiso para avisar: activalo en Ajustes → Apps → Mi Prime → Notificaciones." }; return mostrarAvisos(); }
    await nativo("LocalNotifications", "createChannel", { id: "habitos", name: "Hábitos", description: "Aviso a la hora de cada hábito",
                                                          importance: 4, visibility: 1, vibration: true });
    await nativo("LocalNotifications", "createChannel", { id: "comidas", name: "Comidas", description: "Aviso si falta cargar alguna comida",
                                                          importance: 4, visibility: 1, vibration: true });
    await nativo("LocalNotifications", "createChannel", { id: "finanzas", name: "Vencimientos", description: "Aviso el día antes de cada vencimiento",
                                                          importance: 4, visibility: 1, vibration: true });
    const { notifications: viejos = [] } = await nativo("LocalNotifications", "getPending");
    if(viejos.length) await nativo("LocalNotifications", "cancel", { notifications: viejos.map(n => ({ id: n.id })) });
    const hechos = new Set(S.habits.filter(h => getMark(TODAY, h.id)).map(h => h.id));
    const ahora = new Date(), hora = avisoComidasHora();
    const plan = [...planAvisos(S.habits, ahora, 14, hechos),
                  ...(hora && usaComidas() ? planAvisoComidas(S.comidas, ahora, 14, hora) : []),
                  ...planAvisoVencimientos(S.finanzas, ahora, 14, HORA_AVISO_VENC)].sort((a, b) => a.at - b.at);
    if(plan.length) await nativo("LocalNotifications", "schedule", { notifications: plan.map(a => ({
      id: a.id, title: a.title, body: a.body, channelId: a.canal || "habitos", autoCancel: true,
      schedule: { at: a.at.toISOString(), allowWhileIdle: true } })) });
    AVISOS_ESTADO = { cantidad: plan.length, proximo: plan[0] || null };
  }catch(e){ AVISOS_ESTADO = { error: "No se pudieron programar los avisos: " + (e?.message || e) }; }
  mostrarAvisos();
}

}

/* Pasos: Samsung Health los comparte en Health Connect y la app los lee de ahí
   (plugin capacitor-health), sumados por día en hora local. Health Connect solo
   deja leer con la app abierta: se lee al abrir, al volver a la app, al entrar a
   Pasos y cada 2 minutos mientras Pasos está en pantalla. El permiso se pide
   solo desde el botón, nunca de sorpresa.
   Sin el permiso de historial, pedir algo de más de 30 días antes de dar el
   permiso es un error: la primera vez se leen 29 días; después, desde 3 días
   antes del último leído (si eso falla, se vuelve a los últimos 29). */
const DIAS_HC = 29;
function sincronizarPasos(pedirPermiso = false){
  if(!NATIVO) return Promise.resolve();
  if(pasosEnCurso) return pasosEnCurso;
  const HC = (metodo, opciones) => nativo("HealthPlugin", metodo, opciones);
  const leer = async desde => {
    const rango = { startDate: desde.toISOString(), endDate: new Date().toISOString() };
    const { aggregatedData = [] } = await HC("queryAggregated", { ...rango, dataType: "steps", bucket: "day" });
    const porDia = {};
    for(const b of aggregatedData) if(b?.value != null) porDia[String(b.startDate).slice(0, 10)] = b.value;
    if(Object.keys(porDia).length) return { porDia, como: "suma" };
    const { records = [] } = await HC("queryRecords", { ...rango, dataType: "steps" });   // plan B
    const r = pasosDeRegistros(records);
    return { porDia: r.porDia, como: Object.keys(r.porDia).length ? "registros" : "nada" };
  };
  let marcados = [];
  pasosEnCurso = (async () => {
    try{
      const { available } = await HC("isHealthAvailable");
      if(!available){ PASOS_ESTADO = { error: "sin-hc" }; return; }
      const pedido = { permissions: ["READ_STEPS"] };
      let { permissions } = await HC("checkHealthPermissions", pedido);
      if(!permissions?.READ_STEPS && pedirPermiso) ({ permissions } = await HC("requestHealthPermissions", pedido));
      if(!permissions?.READ_STEPS){ PASOS_ESTADO = { error: "sin-permiso" }; return; }
      const tope = addDays(new Date(), -DIAS_HC), ultimo = S.settings.pasosHasta;
      const desde = ultimo ? addDays(parseISO(ultimo), -3) : tope;
      let r;
      try{ r = await leer(desde); }
      catch(e){ if(desde >= tope) throw e; r = await leer(tope); }   // la ventana se achicó (permiso dado de nuevo)
      mezclarPasos(S, r.porDia, "hc");
      if(r.como !== "nada") S.settings.pasosHasta = TODAY;
      marcados = marcarPorPasos(S, TODAY);
      save();
      PASOS_ESTADO = { ok: true, cuando: new Date(), como: r.como, dias: Object.keys(r.porDia).length };
    }catch(e){
      PASOS_ESTADO = { error: "fallo", detalle: e?.message || String(e) };
    }finally{
      pasosEnCurso = null;
      if(TAB === "pasos" || marcados.length) render();
      if(marcados.includes(TODAY)) toast(`“${caminando()}” en verde: llegaste a ${fmt(metaPasos(S))} pasos`);
    }
  })();
  return pasosEnCurso;
}
if(NATIVO) setInterval(() => { if(!document.hidden && TAB === "pasos") sincronizarPasos(); }, 120000);
function caminando(){ return S.habits.find(h => h.auto?.source === "steps")?.name || "Caminar"; }
sincronizarPasos();

/* =========================================================================
   9. CLAUDE: comida (foto o texto → calorías y proteína) y tickets de compra
   -------------------------------------------------------------------------
   La foto de la comida (achicada a 1024 px), lo escrito en "Agregar a mano"
   sin calorías, o la foto del ticket (a 2048 px, para que se lea la letra
   chica) va a Claude Opus 5.5 por el SDK oficial de Anthropic, empaquetado
   en vendor/anthropic-sdk.js (npm run vendor) y cargado recién la primera vez
   que se usa. La respuesta viene con un JSON
   schema fijo; si Claude no puede, el fallback del servidor reintenta con otro
   modelo. La clave es de la persona, vive solo en este celular y NO va en el
   respaldo (por eso no está en S).
   ========================================================================= */
const CLAVE_IA = "miPrime.claveIA", MODELO_IA = "claude-opus-5-5";
const PROMPT_COMIDA = `Sos nutricionista y estimás calorías y proteínas de comidas a partir de una foto o de lo que la persona escribe, para alguien en Argentina que quiere bajar de peso sin perder músculo.
- Identificá cada alimento o bebida. Con foto, estimá la porción con sus referencias (plato, cubiertos, manos, envases). Con texto, usá la cantidad que dice o, si no la dice, una porción típica en Argentina. Escribí la porción en gramos o en medidas caseras.
- Calculá las kcal y los gramos de proteína de esa porción con valores de tablas nutricionales estándar. Sumá lo que no se ve pero suele llevar (aceite de cocción, manteca, aderezos) como estimación razonable y aclaralo en la nota.
- Si hay varias fotos, son de la misma comida (otro plato, otro ángulo, la etiqueta): sumá todo lo que se come y no cuentes dos veces lo que aparece en más de una.
- Si la persona escribe una aclaración, manda sobre lo que parece la foto.
- Si no hay comida en la foto o en el texto, devolvé items vacíos y explicalo en la nota.
- confianza: "alta" si está claro qué es y cuánto; "baja" si la porción o los ingredientes son dudosos.
- Nombres cortos en castellano rioplatense (por ejemplo "Milanesa de carne", "Puré de papas").`;
const ESQUEMA_COMIDA = {
  type: "object",
  properties: {
    items: { type: "array", items: { type: "object", properties: {
      nombre: { type: "string" }, porcion: { type: "string" }, kcal: { type: "number" }, proteina_g: { type: "number" } },
      required: ["nombre", "porcion", "kcal", "proteina_g"], additionalProperties: false } },
    nota: { type: "string" },
    confianza: { type: "string", enum: ["alta", "media", "baja"] }
  },
  required: ["items", "nota", "confianza"], additionalProperties: false
};
function claveIA(){ try{ return localStorage.getItem(CLAVE_IA) || ""; }catch(e){ return ""; } }
function editarClave(){
  sheet(`<h3>Tu clave de Anthropic</h3>
    <p class="sub">Creala en platform.claude.com → Claves de API (empieza con sk-ant-). Se guarda solo en este celular y no viaja en el respaldo.</p>
    <input type="password" id="clave" autocomplete="off" placeholder="sk-ant-…" value="">
    <div class="row2">${claveIA() ? `<button class="btn ghost danger" data-x="b">Borrar clave</button>` : `<button class="btn ghost" data-x="c">Cancelar</button>`}
      <button class="btn" data-x="o">Guardar</button></div>`);

/* Cámara (capture) o galería, hasta 4 fotos de la misma comida o del mismo ticket:
   la primera abre la hoja y desde ahí se suman las otras. En la app de Android,
   Capacitor abre la cámara del celular; la galería deja elegir varias a la vez.
   `modo` dice qué se fotografía (FOTO_COMIDA o FOTO_TICKET). */
const MAX_FOTOS = 4;
function elegirFoto(camara, previas = [], aclaracion = "", modo = FOTO_COMIDA){
  if(!claveIA()){ editarClave(); return; }
  const lugar = MAX_FOTOS - previas.length; if(lugar <= 0) return;
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  if(camara) inp.setAttribute("capture", "environment");
  else inp.multiple = true;
  inp.onchange = async () => {
    const archivos = [...inp.files]; if(!archivos.length) return;
    if(archivos.length > lugar) toast(`Hasta ${MAX_FOTOS} fotos: entran ${lugar === 1 ? "1 más" : lugar + " más"}`);
    try{ prepararFoto([...previas, ...await Promise.all(archivos.slice(0, lugar).map(a => achicarFoto(a, modo.lado)))], aclaracion, modo); }
    catch(e){ toast("No se pudo abrir la foto"); }
  };
  inp.click();
}
/* JPEG y con el lado más largo a `lado` px: menos tokens, menos costo, sube rápido */
async function achicarFoto(archivo, lado = 1024){
  const img = await createImageBitmap(archivo);
  const k = Math.min(1, lado / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  const dataUrl = c.toDataURL("image/jpeg", 0.8);
  return { dataUrl, base64: dataUrl.split(",")[1] };
}
function prepararFoto(fotos, aclaracion = "", modo = FOTO_COMIDA){
  const n = fotos.length;
  sheet(`<h3>${modo.titulo}</h3>

      <button class="x" data-q="${i}" aria-label="Sacar la foto ${i + 1}">✕</button></figure>`).join("")}</div>
    ${n < MAX_FOTOS ? `<p class="pie" style="margin:4px 0 0">Podés sumar ${MAX_FOTOS - n === 1 ? "1 foto más" : `hasta ${MAX_FOTOS - n} fotos más`} ${modo.sumar}.</p>
      <div class="row2" style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:8px">
        <button class="btn ghost" data-x="mc" style="margin:0">+ Sacar otra</button><button class="btn ghost" data-x="mg" style="margin:0">+ Elegir otra</button></div>` : ""}
    <label class="campo">Aclaración (opcional)</label>

    <div class="row2"><button class="btn ghost" data-x="c">Cancelar</button><button class="btn" data-x="o">Analizar${n > 1 ? ` ${n} fotos` : ""}</button></div>`);

  modal.querySelector('[data-x="c"]').onclick = closeSheet;
  modal.querySelector('[data-x="mc"]')?.addEventListener("click", () => elegirFoto(true, fotos, texto(), modo));
  modal.querySelector('[data-x="mg"]')?.addEventListener("click", () => elegirFoto(false, fotos, texto(), modo));
  modal.querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
    const resto = fotos.filter((_, i) => i !== +b.dataset.q);
    if(resto.length) prepararFoto(resto, texto(), modo); else closeSheet();
  });
  modal.querySelector('[data-x="o"]').onclick = async e => {
    const boton = e.currentTarget;
    boton.disabled = true; boton.textContent = "Analizando…";
    try{ modo.mostrar(await modo.analizar(fotos.map(f => f.base64), texto())); }
    catch(err){ boton.disabled = false; boton.textContent = "Reintentar"; toast(mensajeErrorIA(err)); }
  };
}
let sdkIA = null;
function cargarSDK(){
  return sdkIA ||= new Promise((ok, mal) => {
    if(window.AnthropicSDK) return ok(window.AnthropicSDK);
    const s = document.createElement("script");
    s.src = "vendor/anthropic-sdk.js";
    s.onload = () => ok(window.AnthropicSDK);
    s.onerror = () => { sdkIA = null; mal(new Error("sin-sdk")); };
    document.head.appendChild(s);
  });
}
/* Un pedido a Claude con respuesta en el JSON schema dado; devuelve el JSON ya leído */
async function preguntarAClaude(system, esquema, content){
  const { Anthropic, betaJSONSchemaOutputFormat } = await cargarSDK();
  const client = new Anthropic({ apiKey: claveIA(), dangerouslyAllowBrowser: true, timeout: 120000, maxRetries: 1 });
  const msg = await client.beta.messages.parse({
    model: MODELO_IA,
    max_tokens: 16000,
    betas: ["server-side-fallback-2026-07-01"],
    fallbacks: "default",
    system,
    output_config: { format: betaJSONSchemaOutputFormat(esquema) },
    messages: [{ role: "user", content }]
  });
  if(msg.stop_reason === "refusal") throw new Error("rechazo");
  if(!msg.parsed_output) throw new Error("sin-respuesta");
  return msg.parsed_output;
}
const imagenes = fotos => fotos.map(data => ({ type: "image", source: { type: "base64", media_type: "image/jpeg", data } }));
/* Con fotos (base64, hasta 4), el texto es una aclaración; sin fotos, es la descripción de lo que comió */
async function analizarComida(fotos, texto){
  const n = fotos?.length || 0;
  return normalizarAnalisis(await preguntarAClaude(PROMPT_COMIDA, ESQUEMA_COMIDA, n ? [...imagenes(fotos),
      { type: "text", text: (n > 1 ? `Son ${n} fotos de la misma comida. ` : "")
          + (texto ? `Aclaración: ${texto}` : "Estimá las calorías y proteínas de esta comida.") }]
    : [{ type: "text", text: `Comí: ${texto}\nEstimá las calorías y proteínas.` }]));
}
function mensajeErrorIA(e){
  const A = window.AnthropicSDK?.Anthropic;
  if(e?.message === "sin-sdk") return "No se pudo cargar Claude: revisá la conexión";
  if(e?.message === "rechazo") return "Claude no pudo analizar esa foto";
  if(e?.message === "sin-respuesta") return "Claude respondió algo que no se pudo leer: probá de nuevo";
  if(A){
    if(e instanceof A.AuthenticationError) return "La clave de Anthropic no es válida";
    if(e instanceof A.PermissionDeniedError) return "La clave no tiene permiso para usar Claude";
    if(e instanceof A.RateLimitError) return "Llegaste al límite de uso: probá en un minuto";
    if(e instanceof A.APIConnectionError) return "Sin conexión con Claude";
    if(e instanceof A.BadRequestError) return /credit/i.test(e.message) ? "Tu cuenta de Anthropic no tiene saldo" : "Claude no aceptó el pedido: " + e.message;
    if(e instanceof A.APIError) return `Claude no respondió (${e.status ?? "error"}): probá en un rato`;
  }
  return "No se pudo calcular: probá de nuevo";
}

    <div class="row2"><button class="btn ghost" data-x="c">Descartar</button>${r.items.length ? `<button class="btn" data-x="o">Guardar</button>` : ""}</div>`);
  const total = () => {

                    detalle: r.items.map(({ nombre, porcion, kcal, prot }) => ({ nombre, porcion, kcal, prot })) }, fecha);

/* ---- tickets de compra: comercio, fecha, renglones y total ---- */
const PROMPT_TICKET = `Leés tickets y facturas de compra de Argentina (supermercado, almacén, verdulería, carnicería, delivery) para llevar el control de lo que se gasta en alimentos.
- Pasá cada renglón a un ítem: nombre corto y claro en castellano, sin códigos; cantidad (unidades o kilos; 1 si no dice) y precio, que es lo que se pagó por ese renglón en pesos.
- Los descuentos y promociones van como ítems con precio negativo.
- total: lo que se pagó al final, después de los descuentos. Si el ticket no lo muestra, sumá los renglones.
- comercio: el nombre del negocio como aparece (por ejemplo "Coto", "Carrefour Market", "Verdulería Don José"); vacío si no se lee.
- fecha: la del ticket, como AAAA-MM-DD; vacía si no se lee.
- Los importes argentinos llevan punto en los miles y coma en los decimales: $ 12.345,67 son doce mil trescientos cuarenta y cinco pesos con 67 centavos.
- Si hay varias fotos, son partes del mismo ticket: no repitas los renglones que aparecen en dos.
- Si la persona escribe una aclaración, manda sobre lo que se ve.
- En la nota, avisá si algo no se leyó bien y si hay productos que no son alimentos (limpieza, perfumería) y cuánto suman.
- Si no es un ticket o no se lee, devolvé items vacíos y total 0, y explicalo en la nota.
- confianza: "alta" si se lee todo; "baja" si hay partes borrosas o cortadas.`;
const ESQUEMA_TICKET = {
  type: "object",
  properties: {
    comercio: { type: "string" },
    fecha: { type: "string" },
    items: { type: "array", items: { type: "object", properties: {
      nombre: { type: "string" }, cantidad: { type: "number" }, precio: { type: "number" } },
      required: ["nombre", "cantidad", "precio"], additionalProperties: false } },
    total: { type: "number" },
    nota: { type: "string" },
    confianza: { type: "string", enum: ["alta", "media", "baja"] }
  },
  required: ["comercio", "fecha", "items", "total", "nota", "confianza"], additionalProperties: false
};
async function analizarTicket(fotos, texto){
  const n = fotos.length;
  return normalizarTicket(await preguntarAClaude(PROMPT_TICKET, ESQUEMA_TICKET, [...imagenes(fotos),
    { type: "text", text: (n > 1 ? `Son ${n} fotos del mismo ticket. ` : "") + (texto ? `Aclaración: ${texto}` : "Leé este ticket de compra.") }]));
}
/* Lo que leyó Claude, para corregir antes de guardar: el total es lo que cuenta en Alimentos */
function mostrarTicket(r){
  const fecha = r.fecha && r.fecha <= TODAY ? r.fecha : TODAY, hay = r.items.length > 0 || r.total > 0;
  sheet(`<h3>Lo que leyó Claude</h3>
    <p class="sub">Confianza ${esc(r.confianza)}. Corregí lo que haga falta: el total es lo que suma en Alimentos.</p>

      <div><label class="campo" for="tTotal">Total</label><input type="number" id="tTotal" inputmode="numeric" min="0" value="${r.total}"></div>
      <div><label class="campo" for="tFecha">Cuándo</label><input type="date" id="tFecha" max="${TODAY}" value="${fecha}"></div></div>
    ${renglonesTicket(r.items)}` : ""}
    ${r.nota ? `<p style="font-size:13px;color:var(--ink-2);margin:10px 0 0;line-height:1.5">${esc(r.nota)}</p>` : ""}
    <div class="row2"><button class="btn ghost" data-x="c">Descartar</button>${hay ? `<button class="btn" data-x="o">Guardar</button>` : ""}</div>`);
  const $ = q => modal.querySelector(q);
  $('[data-x="c"]').onclick = closeSheet;
  $('[data-x="o"]')?.addEventListener("click", () => {
    const total = Math.round(Number($("#tTotal").value)), dia = $("#tFecha").value;
    if(!(total > 0 && total <= 1e9)){ toast("Poné el total del ticket"); return; }
    if(!esFechaValida(dia) || dia > TODAY){ toast("Elegí un día de hasta hoy"); return; }
    const g = { comercio: ($("#tComercio").value.trim() || "Ticket").slice(0, 60), total, origen: "ticket" };
    if(r.items.length) g.items = r.items;
    if(r.nota) g.nota = r.nota;
    closeSheet(); guardarGasto(g, dia);
  });
}
